<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142230">
<title>Lapex.ai · Maqueta de navegación</title>
<style>
:root{--nav:#152331;--nav2:#1d3040;--navline:#344552;--ink:#172b3b;--muted:#6d7b89;--line:#dfe6ed;--teal:#087f88;--teal-dark:#06626b;--pale:#e7f5f4;--base:#f5f7fa;--side:270px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--base)}
body{font-size:14px}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #5ad0d5;outline-offset:2px}
button{border:none}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--nav);color:#eaf3f8;border-right:1px solid #263947;z-index:20;min-height:0}
.brand{padding:27px 22px 21px;min-height:114px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.brand-row{display:flex;align-items:center;justify-content:center;min-height:44px;width:100%;gap:4px}
.brand img{display:block;width:180px;max-height:59px;object-fit:contain;filter:brightness(1.36) contrast(1.25)}
.brand-fallback{font-size:29px;font-weight:800;letter-spacing:-1.6px;color:#fff;white-space:nowrap;display:none}
.brand-fallback .mark{color:#45c7ec}
.brand-fallback .suffix{color:#7bd3dc;font-weight:600}
.brand img[hidden]+.brand-fallback{display:inline}
.brand-caption{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:#9fb5c4;font-weight:600}
.mode-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin:0 13px 19px;padding:4px;background:#0f1c28;border:1px solid #2c3d4b;border-radius:13px}
.mode-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;height:62px;padding:7px 1px;border-radius:9px;background:transparent;color:#9fafbd;transition:background .16s,color .16s}
.mode-tab:hover{background:#223746;color:#f5fbfd}
.mode-tab.active{background:#0a6870;color:white;box-shadow:0 3px 11px #0002}
.mode-tab svg{width:19px;height:19px}
.mode-tab span{font-size:9px;line-height:1.05;letter-spacing:-.1px;font-weight:700;white-space:nowrap}
.nav-area{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#465968 transparent;padding:0 12px 14px}
.nav-heading{padding:2px 12px 11px;font-size:10px;text-transform:uppercase;letter-spacing:1.35px;font-weight:750;color:#7994a6}
.nav-items{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:12px;min-height:42px;width:100%;padding:9px 12px;color:#c5d4dd;background:transparent;text-align:left;border-radius:10px;font-weight:600;font-size:13px}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.9}
.nav-item span{min-width:0;flex:1}
.nav-item:hover{background:#263b4b;color:#fff}
.nav-item.active{background:#233f4b;color:#fff;box-shadow:inset 3px 0 0 #4bd0d4}
.nav-item .count{font-size:11px;border:1px solid #516779;padding:2px 6px;border-radius:7px;color:#a9cbd3}
.side-context{margin-top:22px;padding-top:18px;border-top:1px solid var(--navline)}
.session-small{border:1px solid #3e6170;background:#193342;padding:12px;border-radius:11px;text-align:left;width:100%;color:#eaf8fc;display:flex;flex-direction:column;gap:7px}
.session-small strong{font-size:12px;line-height:1.35}
.session-small .meta{font-size:11px;color:#94b6c4}
.side-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--navline);padding:14px 17px 17px;gap:8px}
.profile-link{display:flex;align-items:center;min-width:0;gap:10px;color:#edf5f9;background:none;text-align:left;padding:0}
.profile-link img{height:36px;width:36px;object-fit:cover;border-radius:50%;border:2px solid #84a0ae}
.profile-text{display:flex;flex-direction:column;font-size:12px;font-weight:730;gap:3px}
.profile-text small{font-size:10px;font-weight:500;color:#97acb8}
.help-link{display:grid;place-items:center;width:35px;height:35px;background:#263e4d;border:1px solid #405968;color:#e4f2f8;border-radius:50%}
.help-link svg{height:17px;width:17px}
.main{min-width:0;min-height:100vh}
.workspace{max-width:1440px;margin:0 auto;padding:41px clamp(22px,4.2vw,76px) 85px}
.mobile-bar{display:none}
.page-head{display:flex;align-items:start;justify-content:space-between;gap:25px;margin-bottom:31px}
.eyebrow{text-transform:uppercase;color:var(--teal);font-size:11px;letter-spacing:1.5px;font-weight:800;margin-bottom:9px}
h1{font-size:clamp(26px,2.35vw,35px);letter-spacing:-1.25px;line-height:1.14;margin:0 0 10px;font-weight:750}
.lede{font-size:14px;color:var(--muted);margin:0;line-height:1.65;max-width:740px}
.head-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #cddae3;background:white;color:#244055;border-radius:9px;padding:10px 14px;min-height:39px;font-size:12px;font-weight:750;white-space:nowrap;box-shadow:0 1px 2px #12233908}
.btn svg{width:16px;height:16px}
.btn:hover:not(:disabled){background:#eff7f8;border-color:#9dcbd0}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 5px 13px #087f8828}
.btn.primary:hover:not(:disabled){background:var(--teal-dark)}
.btn.flat{background:transparent;box-shadow:none}
.btn.sm{min-height:32px;padding:7px 10px;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:800;white-space:nowrap}
.pill:before{content:"";height:6px;width:6px;border-radius:50%;background:currentColor}
.pill.ok{background:#e3f5ed;color:#16825b}
.pill.wait{background:#fff3df;color:#9b631a}
.pill.neutral{background:#e9eff5;color:#5d7487}
.demo-note{display:flex;align-items:center;gap:10px;font-size:11px;color:#627989;background:#eef3f8;border:1px solid #dee6ee;border-radius:10px;padding:10px 13px;margin-bottom:23px}
.demo-note svg{color:#7792a2;width:15px;height:15px;flex:none}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 3px 13px #20394d06;min-width:0}
.card-pad{padding:22px}
.card h2{font-size:15px;letter-spacing:-.2px;margin:0 0 5px}
.card-sub{font-size:12px;line-height:1.5;color:var(--muted);margin:0}
.stat-label{color:#698090;font-size:11px;font-weight:740;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.stat-label svg{width:18px;height:18px;color:#809cad}
.stat-num{font-size:29px;letter-spacing:-1px;font-weight:780;line-height:1}
.stat-foot{font-size:11px;margin-top:12px;color:#8a9dab}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:26px 0 14px}
.section-title h2{font-size:16px;letter-spacing:-.35px;margin:0}
.section-title p{font-size:12px;color:var(--muted);margin:0}
.link{border:0;background:none;color:var(--teal);font-weight:750;font-size:12px;padding:5px}
.link:hover{text-decoration:underline}
.list{display:flex;flex-direction:column}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #edf1f5}
.list-row:last-child{border-bottom:0;padding-bottom:2px}
.list-title{font-weight:740;font-size:12px}
.list-sub{font-size:11px;color:var(--muted);margin-top:5px}
.list-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chart-wrap{height:184px;margin:20px 0 6px}
.chart-wrap svg{width:100%;height:100%;display:block}
.chart-meta{display:flex;justify-content:space-between;gap:8px;color:#8093a2;font-size:10px;margin:2px 0 0}
.key{display:flex;align-items:center;gap:7px;font-size:11px;color:#687b8a}
.key:before{content:"";width:13px;height:3px;background:#1d9eaa;border-radius:3px}
.strong{font-weight:760}
.summary-box{padding:18px;border-radius:12px;background:#eaf7f6;border:1px solid #c7e8e5;margin-top:17px}
.summary-box strong{color:#14616a;font-size:12px}
.summary-box p{color:#496d76;font-size:11px;line-height:1.65;margin:6px 0 0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;color:#3c5161;font-weight:780}
.field input,.field select{width:100%;height:43px;padding:0 12px;border:1px solid #cfdbe4;border-radius:9px;background:#fff;color:#233c4e;outline-offset:2px}
.field input::placeholder{color:#9ba9b6}
.checklist{display:grid;gap:9px;margin-top:3px}
.checkline{display:flex;align-items:center;gap:10px;border:1px solid #d7e3ea;border-radius:9px;padding:12px 14px;font-size:12px;cursor:pointer}
.checkline:hover{background:#f3f9fa}
.checkline input{accent-color:var(--teal);height:16px;width:16px}
.checkline strong{font-size:12px}
.checkline small{font-size:11px;color:#80929f}
.inline-info{margin-top:15px;font-size:11px;line-height:1.6;color:#7c8996}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 24px}
.step{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #dce5ec;border-radius:10px;padding:11px 12px;color:#788998;font-size:11px;font-weight:720;min-height:49px}
.step .num{width:22px;height:22px;border-radius:50%;background:#edf1f4;display:grid;place-items:center;font-size:10px;flex:none}
.step.done{border-color:#c1e3e2;background:#f0faf9;color:#126b72}
.step.done .num{background:#117f87;color:#fff}
.step.current{border-color:#9bced0;background:#e9f5f5;color:#146e75}
.tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{border:1px solid #dce5eb;background:#f6f9fb;border-radius:7px;padding:7px 9px;font-size:11px;color:#597082;font-weight:640}
.tabs{display:flex;align-items:center;gap:4px;border-bottom:1px solid #dbe4ec;margin:22px 0 23px;overflow-x:auto}
.tab{padding:13px 17px;background:transparent;border-bottom:3px solid transparent;font-size:12px;color:#778b99;font-weight:740;white-space:nowrap}
.tab:hover{color:#176971}
.tab.active{color:#087b83;border-bottom-color:#087b83}
.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:49px 22px}
.empty .empty-icon{width:55px;height:55px;display:grid;place-items:center;color:#178b92;background:#e5f5f5;border-radius:15px;margin-bottom:16px}
.empty .empty-icon svg{width:25px;height:25px}
.empty h2{font-size:18px;margin:0 0 8px}
.empty p{font-size:12px;line-height:1.65;color:var(--muted);max-width:420px;margin:0 0 18px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:#80909f;background:#f9fbfc;font-weight:740;font-size:10px;letter-spacing:.7px;text-transform:uppercase;padding:13px 18px;border-bottom:1px solid var(--line)}
td{padding:15px 18px;border-bottom:1px solid #edf1f5;color:#43586a}
tr:last-child td{border-bottom:0}
td strong{color:#233748}
.surface-top{padding:17px 21px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.surface-top h2{font-size:14px;margin:0}
.surface-top small{color:#8a9aaa}
.surface-actions{display:flex;gap:6px}
.notice{margin:12px 0 0;color:#8d5c22;background:#fff5e5;border:1px solid #f3dfbf;border-radius:9px;padding:11px 13px;font-size:12px}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:#0c1b29a9;display:grid;place-items:center;padding:20px}
.modal{width:min(440px,100%);background:#fff;border-radius:15px;padding:25px;box-shadow:0 22px 70px #0003}
.modal h2{font-size:19px;margin:0 0 7px}
.modal p{font-size:12px;color:#6b8190;line-height:1.6}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}
.toast{position:fixed;bottom:23px;right:24px;z-index:150;background:#1d3641;color:#fff;font-size:12px;padding:12px 18px;border-radius:10px;box-shadow:0 10px 28px #1224353b}
.small-title{color:#738695;text-transform:uppercase;font-size:10px;letter-spacing:1.2px;font-weight:770;margin:0 0 12px}
.mobile-backdrop{display:none}
@media(max-width:1100px){:root{--side:251px}.workspace{padding:32px 28px 60px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:720px){.app{display:block}.sidebar{position:fixed;left:0;top:0;width:270px;transform:translateX(-100%);transition:transform .2s;box-shadow:9px 0 36px #0002}.app.drawer-open .sidebar{transform:translateX(0)}.mobile-backdrop{position:fixed;inset:0;z-index:15;background:#09192580;display:none}.app.drawer-open .mobile-backdrop{display:block}.mobile-bar{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:#152331;color:#fff}.mobile-bar strong{font-size:17px}.mobile-bar .btn{background:#263b4c;color:#fff;border-color:#3e5362}.workspace{padding:25px 17px 64px}.page-head{gap:13px;flex-direction:column}.head-actions{justify-content:flex-start}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card-pad{padding:17px}.stat-num{font-size:24px}.steps{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.list-row{align-items:flex-start;flex-direction:column}.list-actions{justify-content:flex-start}.table-wrap{margin:0 -5px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}

/* Lapex: iteración de sesiones, bibliotecas y cuenta */
.nav-area.anav{display:flex;flex-direction:column;min-height:0;overflow-y:auto;overflow-x:hidden}
.nav-empty{display:flex;flex:1;flex-direction:column;min-height:0;gap:12px;padding:4px 4px 0}
.nav-sessions{overflow-y:auto;overflow-x:hidden;flex:1;min-height:100px;border:1px solid #3c5160;background:#10202c;border-radius:10px;scrollbar-width:thin}
.nav-sessions button{display:block;width:100%;background:transparent;color:#c0d1dc;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:12px;border-bottom:1px solid #253a48;font-size:12px}
.nav-sessions button.selected{background:#21515a;box-shadow:inset 3px 0 #50cdd3;color:#fff}
.nav-sessions button:hover{background:#274554}
.nav-big{width:100%;padding:12px;background:#096e77;border-radius:9px;color:#fff;font-size:12px;font-weight:730}
.nav-big.secondary{background:#254351;border:1px solid #4a6876}
.nav-big:disabled{opacity:.43;cursor:not-allowed}
.session-label{padding:5px 9px 14px;margin-bottom:10px;border-bottom:1px solid #354c59}
.session-label small{display:block;color:#8caab7;text-transform:uppercase;letter-spacing:1.2px;font-size:10px;margin-bottom:8px}
.session-label strong{font-size:14px;color:#fff;overflow-wrap:anywhere}
.session-label button{display:block;padding:9px 0 0;background:transparent;color:#81cfd0;font-size:11px}
.group-toggle{display:flex;width:100%;align-items:center;justify-content:space-between;padding:13px 12px;background:transparent;color:#e1ebf1;font-size:12px;font-weight:750;border-radius:8px}
.group-toggle:hover,.group-toggle.expanded{background:#283d4a}
.group-list{display:flex;flex-direction:column;gap:2px;margin:2px 0 11px 17px}
.group-list button{background:transparent;color:#b8cad4;font-size:11px;padding:10px 11px;text-align:left;border-radius:8px}
.group-list button.active,.group-list button:hover{background:#18515c;color:white}
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:11px;color:#7a909e;font-weight:710}
.crumb button{padding:0;background:transparent;color:#087f88;font-size:11px;font-weight:730}
.crumb button:hover{text-decoration:underline}
.crumb .slash{color:#a6b6c0}
.data-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.records-table{max-height:49vh;min-height:180px;overflow-y:auto;overflow-x:auto}
.record-actions{display:flex;gap:5px}
.record-actions .btn{padding:7px;font-size:11px}
.analysis-stage{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:12px;height:calc(100vh - 185px);min-height:540px}
.analysis-stage>.card{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.stage-body{flex:1;min-height:0;overflow:auto;padding:17px 19px}
.stage-chat{flex:1;min-height:0;overflow:auto;background:#fafdfe;padding:15px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:87%;padding:10px 12px;border:1px solid #dce6ec;background:#eef3f5;color:#345061;border-radius:11px;font-size:12px;line-height:1.5}
.bubble.user{align-self:flex-end;background:#e3f5f3;border-color:#bee7e3}
.chat-form{display:flex;gap:8px;align-items:center;border-top:1px solid #e3eaf0;padding:12px}
.chat-form textarea{flex:1;min-height:40px;resize:vertical;max-height:90px;border:1px solid #cfdee6;border-radius:9px;padding:10px;font:inherit}
.stage-hint{font-size:10px;color:#8495a2;padding:0 12px 9px;text-align:center}
.data-row{padding:12px;border:1px solid #e1e9ee;border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.profile-link{flex:1}
.profile-text{font-size:12px}
.profile-link .plan{color:#77d1d3;font-size:10px}
.side-bottom{position:relative;flex:none}
.profile-menu{position:absolute;bottom:75px;left:12px;right:12px;z-index:50;background:#fff;color:#213746;border:1px solid #dbe5ec;border-radius:13px;padding:7px;box-shadow:0 16px 34px #0004}
.profile-menu[hidden]{display:none}
.profile-menu .menu-top{padding:12px;border-bottom:1px solid #e3ebef;margin-bottom:5px}
.profile-menu .menu-top strong{display:block;font-size:13px}
.profile-menu .menu-top small{display:block;color:#728796;margin-top:4px}
.profile-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:11px 12px;text-align:left;color:#254053;background:transparent;border-radius:8px;font-size:12px}
.profile-menu button:hover{background:#eaf6f6}
.profile-menu button svg{width:16px;height:16px;color:#59798a}
@media(max-width:1100px){.data-stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.filters{grid-template-columns:1fr}.analysis-stage{height:auto;grid-template-rows:350px 360px}.data-stats{grid-template-columns:repeat(2,1fr)}.record-actions{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" aria-label="Navegación principal">
    <div class="brand">
      <div class="brand-row">
        <img src="assets/lapex-logo.png" alt="Lapex.ai" onerror="this.hidden=true">
        <span class="brand-fallback">L<span class="mark">Λ</span>pex<span class="suffix">.ai</span></span>
      </div>
      <div class="brand-caption">Motorsport intelligence</div>
    </div>
    <div class="mode-tabs" id="mode-tabs" aria-label="Áreas de la aplicación"></div>
    <nav class="nav-area" id="side-nav" aria-label="Secciones"></nav>
    <div class="side-bottom">
      <button class="profile-link" data-action="profile-toggle" aria-label="Abrir menú de usuario" aria-expanded="false"><img src="assets/profile-mebene.jpg" alt=""><span class="profile-text">mebene<small>Mi cuenta</small></span></button>
      <div class="profile-menu" hidden aria-label="Opciones de cuenta"></div><button class="help-link" data-route="help" title="Ayuda" aria-label="Ayuda" id="help-btn"></button>
    </div>
  </aside>
  <div class="mobile-backdrop" data-action="close-drawer"></div>
  <main class="main">
    <div class="mobile-bar"><button class="btn sm" data-action="toggle-drawer" aria-label="Abrir menú">☰ Menú</button><strong>Lapex.ai</strong></div>
    <div class="workspace" id="workspace" aria-live="polite"></div>
  </main>
</div>
<div id="dialog-root"></div>
<div id="toast-root"></div>
<script>
(function(){
'use strict';
var I={

function statsData(a){var pilots=new Set(a.map(function(d){return d.pilot}).filter(Boolean)).size,tracks=new Set(a.map(function(d){return d.track}).filter(Boolean)).size,days=new Set(a.map(function(d){return d.date})).size;return stat('Registros',a.length,'Datos visibles','database')+stat('Circuitos',tracks,'Distintos','map')+stat('Pilotos',pilots,'Distintos','user')+stat('Archivos por día',days?(a.length/days).toFixed(1).replace('.',','):'0','Por día con importaciones','chart')}
function filterSelect(arr,value){return '<option value="">Todos</option>'+arr.map(function(x){return '<option value="'+x.id+'"'+(x.id===value?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')}
function datasetsPage(){var a=filtered();return head([['Datos'],['Biblioteca de datos']],'Biblioteca de datos','Estadísticas, filtros y operaciones sobre los registros importados.',btn(icon('upload')+' Importar datos','data-route="import"','primary'))+note()+'<div class="data-stats" id="data-stats">'+statsData(a)+'</div><div class="section-title"><h2>Registros importados</h2></div><div class="card card-pad"><div class="filters"><div class="field"><label>Buscar</label><input data-filter="q" placeholder="Nombre u observaciones" value="'+esc(filters.q)+'"></div><div class="field"><label>Fuente</label><select data-filter="type"><option value="">Todas</option>'+sources.map(function(x){return '<option value="'+x[0]+'"'+(filters.type===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></div><div class="field"><label>Piloto</label><select data-filter="pilot">'+filterSelect(state.pilots,filters.pilot)+'</select></div><div class="field"><label>Circuito</label><select data-filter="track">'+filterSelect(state.tracks,filters.track)+'</select></div></div></div><div class="card" style="margin-top:12px"><div class="records-table"><table><thead><tr><th>Nombre</th><th>Fecha</th><th>Hora</th><th>Observaciones</th><th>Acciones</th></tr></thead><tbody id="data-rows">'+rowsData(a)+'</tbody></table></div><div class="table-caption" id="data-count">'+a.length+' de '+state.datasets.length+' registros</div></div>'}
function dataDetail(){var d=find('datasets',dataId);if(!d)return datasetsPage();var pairs=[['Nombre',d.name],['Fecha',d.date],['Hora',d.time],['Observaciones',d.obs],['Tipo de fuente',sourceName(d.type)],['Piloto',(find('pilots',d.pilot)||{}).name||'—'],['Circuito',(find('tracks',d.track)||{}).name||'—']];return head([['Datos'],['Biblioteca de datos','datasets'],[d.name]],d.name,'Detalles del registro seleccionado.',btn('Editar','data-action="edit-data" data-id="'+d.id+'"')+btn('Compartir','data-action="share-data" data-id="'+d.id+'"','primary'))+note()+'<div class="card card-pad"><div class="grid two">'+pairs.map(function(p){return '<div class="card card-pad"><div class="small-title">'+p[0]+'</div><strong>'+esc(p[1])+'</strong></div>'}).join('')+'</div></div>'}
function dataForm(){var d=find('datasets',dataId);if(!d)return datasetsPage();return head([['Datos'],['Biblioteca de datos','datasets'],[d.name,'data-detail'],['Editar']],'Editar datos','Edición de metadatos simulados.',btn('Volver','data-route="datasets"'))+note()+'<div class="card card-pad"><form id="data-form" class="form-grid"><div class="field full"><label>Nombre</label><input required name="name" value="'+esc(d.name)+'"></div><div class="field"><label>Fecha</label><input required type="date" name="date" value="'+d.date+'"></div><div class="field"><label>Hora</label><input required type="time" name="time" value="'+d.time+'"></div><div class="field"><label>Tipo de fuente</label><select name="type">'+sources.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===d.type?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></div><div class="field"><label>Piloto</label><select name="pilot">'+options(state.pilots,d.pilot)+'</select></div><div class="field"><label>Circuito</label><select name="track">'+options(state.tracks,d.track)+'</select></div><div class="field full"><label>Observaciones</label><input name="obs" maxlength="180" value="'+esc(d.obs)+'"></div><div class="field full"><button class="btn primary" type="submit">Guardar cambios</button></div></form></div>'}
function importPage(){return head([['Datos'],['Importar datos']],'Importar datos','Seleccioná un archivo y su formato. El procesamiento real queda pendiente de especificación.')+note()+'<div class="steps"><div class="step '+(importStep===1?'current':'done')+'"><span class="num">1</span>Archivo</div><div class="step '+(importStep===2?'current':'')+'"><span class="num">2</span>Preparación</div><div class="step"><span class="num">3</span>Normalización</div><div class="step"><span class="num">4</span>Revisión</div></div>'+(importStep===1?'<div class="card card-pad" style="max-width:700px"><form id="import-form"><div class="field"><label>Seleccionar archivo local</label><input required name="file" type="file" accept=".csv,.txt,.xlsx,.xls,.json,.ld"></div><div class="field" style="margin-top:16px"><label>Tipo de archivo</label><select required name="format"><option value="">Elegir formato…</option><option>CSV</option><option>TXT</option><option>XLSX</option><option>Otro / por definir</option></select></div><p class="inline-info">El archivo no se lee ni se envía; sólo se mostrará su nombre.</p><div style="margin-top:20px"><button class="btn primary" type="submit">Continuar</button></div></form></div>':'<div class="card card-pad"><h2>Preparación del archivo</h2><p class="card-sub">'+esc(fileName)+' · '+esc(fileFormat)+'</p><div class="notice">La normalización y las preguntas específicas dependen de la futura definición del importador. No se ha importado ningún dato.</div><div style="margin-top:18px">'+btn('Volver','data-action="import-back"')+'</div></div>')}
function settingsPage(){return head([['Configuración'],['Preferencias']],'Preferencias','Preferencias ilustrativas.')+note()+'<div class="card card-pad"><div class="field"><label>Unidades de velocidad</label><select><option>km/h</option><option>mph</option></select></div></div>'}
function accountPage(){return head([['Configuración'],['Mi cuenta']],'Mi cuenta','Perfil ficticio.')+note()+'<div class="card card-pad"><strong>Martín Ebene</strong><p class="card-sub">Plan '+plan+' · Cuenta de demostración</p></div>'}
function helpPage(){return head([['Configuración'],['Ayuda']],'Ayuda','Centro de ayuda pendiente de completar.')+note()}
function profileMenu(){return '<div class="menu-top"><strong>Martín Ebene</strong><small>Plan '+plan+' · Lapex.ai</small></div>'+[['usage','Uso y estadísticas','chart'],['membership','Administrar membresía','settings'],['switch','Cambiar de cuenta','user'],['signout','Cerrar sesión','arrow']].map(function(x){return '<button data-action="profile-option" data-id="'+x[0]+'">'+icon(x[2])+x[1]+'</button>'}).join('')}
function render(){renderNav();var pages={'analysis-home':analysisHome,session:sessionPage,'source-view':sourcePage,'context-view':contextPage,'module-view':modulePage,pilots:function(){return library('pilots')},tracks:function(){return library('tracks')},vehicles:function(){return library('vehicles')},modules:function(){return library('modules')},'resource-form':resourceForm,datasets:datasetsPage,'data-detail':dataDetail,'data-form':dataForm,import:importPage,settings:settingsPage,account:accountPage,help:helpPage};document.getElementById('workspace').innerHTML=(pages[route]||analysisHome)();var stream=document.getElementById('chat-stream');if(stream)stream.scrollTop=stream.scrollHeight}
function go(r){route=r;mode=['analysis-home','session','source-view','context-view','module-view'].includes(r)?'analysis':['pilots','tracks','vehicles','modules','resource-form'].includes(r)?'resources':['datasets','data-detail','data-form','import'].includes(r)?'data':'config';profileOpen=false;document.getElementById('app').classList.remove('drawer-open');render();window.scrollTo(0,0)}
function toast(s){var root=document.getElementById('toast-root');root.innerHTML='<div class="toast">'+esc(s)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(function(){root.innerHTML=''},2600)}
function dialog(title,body){document.getElementById('dialog-root').innerHTML='<div class="modal-backdrop" data-action="dismiss"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h2>'+esc(title)+'</h2>'+body+'</div></div>'}
function closeDialog(){document.getElementById('dialog-root').innerHTML=''}
function refreshRows(){if(!document.getElementById('data-rows'))return;var a=filtered();document.getElementById('data-rows').innerHTML=rowsData(a);document.getElementById('data-stats').innerHTML=statsData(a);document.getElementById('data-count').textContent=a.length+' de '+state.datasets.length+' registros'}
function act(t){var a=t.dataset.action,id=t.dataset.id,kind=t.dataset.kind;
if(a==='toggle-drawer'){document.getElementById('app').classList.toggle('drawer-open');return}
if(a==='close-drawer'){document.getElementById('app').classList.remove('drawer-open');return}
if(a==='choose-session'){selectedSession=id;renderNav();return}
if(a==='open-session'){if(find('sessions',selectedSession)){sessionId=selectedSession;go('session')}return}
if(a==='new-session'){var s='s'+(++counter);state.sessions.unshift({id:s,name:'Nueva sesión '+counter,pilot:'',track:'',vehicle:'',datasets:[],analyzed:false});selectedSession=s;sessionId=s;go('session');return}
if(a==='leave-session'){selectedSession=sessionId;sessionId=null;go('analysis-home');return}
if(a==='toggle-group'){groupOpen[id]=!groupOpen[id];renderNav();return}
if(a==='subpage'){if(t.dataset.type==='source')sourceKey=id;if(t.dataset.type==='context')contextKey=id;if(t.dataset.type==='module')moduleKey=id;go(t.dataset.type+'-view');return}
if(a==='new-resource'||a==='edit-resource'){editKind=kind;editId=a==='new-resource'?'':id;go('resource-form');return}
if(a==='view-data'||a==='edit-data'){dataId=id;go(a==='view-data'?'data-detail':'data-form');return}
if(a==='share-data'){var d=find('datasets',id);if(d)dialog('Compartir registro','<p>'+esc(d.name)+'</p><p>Acción simulada. No se genera un enlace ni se transmite información.</p><div class="modal-actions">'+btn('Cerrar','data-action="dismiss"','primary')+'</div>');return}
if(a==='delete'){var x=find(kind,id);if(x)dialog('Eliminar','<p>¿Eliminar <strong>'+esc(x.name)+'</strong> de los datos ficticios?</p><div class="modal-actions">'+btn('Cancelar','data-action="dismiss"')+btn('Eliminar','data-action="confirm-delete" data-kind="'+kind+'" data-id="'+id+'"','primary')+'</div>');return}
if(a==='confirm-delete'){state[kind]=state[kind].filter(function(x){return x.id!==id});if(kind==='datasets')state.sessions.forEach(function(s){s.datasets=s.datasets.filter(function(x){return x!==id})});closeDialog();go(kind);toast('Elemento eliminado');return}
if(a==='dismiss'){closeDialog();return}
if(a==='import-back'){importStep=1;go('import');return}
if(a==='profile-toggle'){profileOpen=!profileOpen;document.querySelector('.profile-menu').hidden=!profileOpen;document.querySelector('.profile-link').setAttribute('aria-expanded',profileOpen?'true':'false');return}
if(a==='profile-option'){profileOpen=false;document.querySelector('.profile-menu').hidden=true;if(id==='usage'){dialog('Uso y estadísticas','<p>Plan '+plan+'. Resumen de uso ilustrativo, sin contadores reales.</p>'+stat('Sesiones',state.sessions.length,'Sesiones ficticias','folder')+'<div class="modal-actions">'+btn('Cerrar','data-action="dismiss"')+'</div>');return}if(id==='membership'){dialog('Administrar membresía','<p>Plan actual: <strong>'+plan+'</strong>. No se realizan pagos en la maqueta.</p><div class="modal-actions">'+btn('Simular plan '+(plan==='Free'?'Pro':'Free'),'data-action="toggle-plan"','primary')+btn('Cerrar','data-action="dismiss"')+'</div>');return}if(id==='switch'){dialog('Cambiar de cuenta','<p>No hay otras cuentas ni acceso real en este prototipo.</p><div class="modal-actions">'+btn('Cerrar','data-action="dismiss"')+'</div>');return}if(id==='signout'){dialog('Cerrar sesión','<p>El cierre de sesión es ilustrativo. No existe autenticación real ni conexión con cuentas.</p><div class="modal-actions">'+btn('Cerrar','data-action="dismiss"')+'</div>');return}}
if(a==='toggle-plan'){plan=plan==='Free'?'Pro':'Free';closeDialog();render();toast('Plan de demostración: '+plan);return}
}
document.addEventListener('click',function(e){var t=e.target.closest('[data-mode],[data-route],[data-action]');if(!t){if(profileOpen&&!e.target.closest('.side-bottom')){profileOpen=false;document.querySelector('.profile-menu').hidden=true}return}if(t.classList.contains('modal-backdrop')&&e.target!==t)return;if(t.dataset.mode){var m=t.dataset.mode;go(m==='analysis'?(active()?'session':'analysis-home'):m==='resources'?'pilots':m==='data'?'datasets':'settings');return}if(t.dataset.route){go(t.dataset.route);return}if(t.dataset.action)act(t)});
document.addEventListener('submit',function(e){var f=e.target,id=f.id;if(!['session-form','sources-form','context-form','resource-form','data-form','import-form','chat-form'].includes(id))return;e.preventDefault();var data=new FormData(f),s=active();
if(id==='session-form'&&s){s.name=String(data.get('name')).trim();s.pilot=data.get('pilot');s.vehicle=data.get('vehicle');s.track=data.get('track');s.datasets=data.getAll('dataset');render();toast('Sesión guardada');return}
if(id==='sources-form'&&s){s.datasets=s.datasets.filter(function(x){var d=find('datasets',x);return d&&d.type!==sourceKey}).concat(data.getAll('source'));render();toast('Fuentes guardadas');return}
if(id==='context-form'&&s){s[contextKey]=data.get('value');render();toast('Contexto guardado');return}
if(id==='resource-form'){var item=editId?find(editKind,editId):null;if(item){item.name=String(data.get('name'));item.detail=String(data.get('detail'))}else state[editKind].push({id:'r'+(++counter),name:String(data.get('name')),detail:String(data.get('detail'))});go(editKind);toast('Recurso guardado');return}
if(id==='data-form'){var d=find('datasets',dataId);if(d)['name','date','time','type','pilot','track','obs'].forEach(function(k){d[k]=String(data.get(k)||'')});go('data-detail');toast('Metadatos guardados');return}
if(id==='import-form'){var el=f.querySelector('input[type="file"]');if(!el.files.length)return;fileName=el.files[0].name;fileFormat=data.get('format');importStep=2;go('import');return}
if(id==='chat-form'&&s){var message=String(data.get('message')||'').trim();if(!message)return;var key=s.id+'-'+moduleKey;if(!chats[key])chats[key]=[];chats[key].push({who:'user',text:message},{who:'bot',text:'Respuesta simulada. El módulo «'+moduleName(moduleKey)+'» utilizará la evidencia disponible cuando se implemente el análisis real.'});render();return}
});
document.addEventListener('input',function(e){if(e.target.dataset.filter){filters[e.target.dataset.filter]=e.target.value;refreshRows()}});
document.addEventListener('change',function(e){if(e.target.dataset.filter){filters[e.target.dataset.filter]=e.target.value;refreshRows()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDialog();profileOpen=false;document.querySelector('.profile-menu').hidden=true;document.getElementById('app').classList.remove('drawer-open')}});
document.querySelector('.profile-menu').innerHTML=profileMenu();
render();
})();

</script>
</body></html>
