<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Maqueta funcional navegable de Lapex.">
  <title>Lapex · Maqueta funcional</title>
  <style>
    :root {
      color-scheme: light;
      --header-tools-h: 40px;
      --header-title-h: 48px;
      --header-h: calc(var(--header-tools-h) + var(--header-title-h));
      --chat-width: 34vw;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-subtle: #f8f9fb;
      --surface-muted: #f1f3f5;
      --text: #1f2328;
      --muted: #656d76;
      --line: #d8dee4;
      --line-strong: #c6cdd5;
      --accent: #087f8c;
      --accent-strong: #05636d;
      --accent-soft: #eaf5f6;
      --header: #161d24;
      --header-hover: #222c36;
      --shadow-overlay: 0 12px 32px rgba(31,35,40,.14), 0 2px 6px rgba(31,35,40,.08);
      --radius-sm: 8px;
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 75%, white);
      outline-offset: 2px;
    }

    .shell { min-width: 760px; min-height: 100vh; }

    .app-header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 200;
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) 76px;
      grid-template-rows: var(--header-tools-h) var(--header-title-h);
      height: var(--header-h);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(31,35,40,.06);
    }

    .brand {
      grid-row: 1 / 3;
      display: grid;
      place-items: center;
      border: 0;
      border-right: 1px solid #2b3540;
      background: var(--header);
      color: #fff;
    }

    .brand span {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(145deg, #149da9, #08737c);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
      font-size: 19px;
      font-weight: 760;
      letter-spacing: -.04em;
    }

    .brand:hover span { filter: brightness(1.06); }

    .tool-row {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      align-items: stretch;
      gap: 0;
      min-width: 0;
      padding-left: 8px;
      background: var(--header);
      color: #fff;
    }

    .tool-menu { position: relative; display: flex; align-items: stretch; }

    .tool-trigger {
      position: relative;
      width: max-content;
      min-width: max-content;
      height: var(--header-tools-h);
      padding: 0 12px;
      border: 0;
      background: transparent;
      color: #c9d1d9;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: background .12s ease, color .12s ease;
    }

    .tool-trigger:hover,
    .tool-menu.is-open .tool-trigger,
    .tool-menu.is-current-group .tool-trigger {
      background: var(--header-hover);
      color: #fff;
    }

    .tool-menu.is-current-group .tool-trigger::before {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 0;
      height: 2px;
      border-radius: 2px 2px 0 0;
      background: #3db7c2;
    }

    .tool-trigger::after {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 0 3px 7px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      opacity: .8;
    }

    .tool-dropdown {
      position: absolute;
      top: calc(100% - 1px);
      left: 0;
      z-index: 500;
      display: none;
      width: max-content;
      min-width: 100%;
      max-width: min(430px, 70vw);
      padding: 6px;
      border: 1px solid var(--line-strong);
      border-radius: 0 0 10px 10px;
      background: var(--surface);
      box-shadow: var(--shadow-overlay);
    }

    .tool-menu.is-open .tool-dropdown { display: grid; }

    .tool-item {
      width: 100%;
      min-width: max-content;
      min-height: 36px;
      padding: 8px 11px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      white-space: nowrap;
    }

    .tool-item:hover { background: var(--surface-muted); }
    .tool-item.is-current {
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-weight: 650;
    }

    .section-title-row {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 0 24px;
      border-right: 1px solid var(--line);
      background: var(--surface);
      text-align: center;
    }

    .section-title-row h1 {
      width: 100%;
      overflow: hidden;
      margin: 0;
      color: #24292f;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -.018em;
      line-height: 1.2;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-button {
      grid-column: 3;
      grid-row: 1 / 3;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
      padding: 6px 4px;
      border: 0;
      border-left: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      transition: background .12s ease;
    }

    .profile-button:hover { background: var(--surface-subtle); }

    .avatar {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid #cfe6e8;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 10px;
      font-weight: 750;
    }

    .profile-label { color: var(--muted); font-size: 10px; font-weight: 550; }

    .workspace {
      position: fixed;
      inset: var(--header-h) 0 0 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 5px minmax(280px, var(--chat-width));
      overflow: hidden;
      background: var(--bg);
    }

    .workspace.no-chat { grid-template-columns: minmax(0, 1fr); }
    .workspace.no-chat .splitter,
    .workspace.no-chat .chat-panel { display: none; }

    .workspace.chat-collapsed { grid-template-columns: minmax(0, 1fr) 0 42px; }
    .workspace.chat-collapsed .splitter { display: none; }
    .workspace.chat-collapsed .chat-body,
    .workspace.chat-collapsed .chat-composer,
    .workspace.chat-collapsed .chat-title-text { display: none; }
    .workspace.chat-collapsed .chat-header {
      height: 100%;
      padding: 10px 5px;
      flex-direction: column;
      justify-content: flex-start;
      border-left: 1px solid var(--line);
    }
    .workspace.chat-collapsed .chat-header::after {
      content: "IA";
      margin-top: 12px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      writing-mode: vertical-rl;
    }
    .workspace.chat-collapsed .collapse-chat { transform: rotate(180deg); }

    .section-panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }

    .section-tabs {
      flex: 0 0 auto;
      min-height: 42px;
      display: flex;
      align-items: end;
      gap: 4px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .section-tabs[hidden] { display: none; }

    .tab-button {
      height: 41px;
      padding: 0 12px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      transition: color .12s ease, border-color .12s ease;
    }

    .tab-button:hover { color: var(--text); }
    .tab-button.is-active {
      border-bottom-color: var(--accent);
      color: var(--text);
    }

    .section-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 28px 30px 42px;
      background: var(--surface);
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .section-inner { max-width: 1040px; margin: 0 auto; }

    .context-line {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .01em;
    }

    .section-inner h2 {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -.025em;
    }

    .lead {
      max-width: 720px;
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.55;
    }

    .placeholder-card {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-subtle);
    }

    .placeholder-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 650;
    }
    .placeholder-card p { margin: 0; color: var(--muted); line-height: 1.55; }

    .demo-blocks {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .demo-block {
      min-height: 92px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
    }

    .splitter {
      position: relative;
      z-index: 20;
      background: #eef1f3;
      cursor: col-resize;
      touch-action: none;
      transition: background .12s ease;
    }

    .splitter::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 1px;
      width: 3px;
      height: 44px;
      border-radius: 99px;
      background: #c3cbd2;
      transform: translateY(-50%);
      transition: background .12s ease, height .12s ease;
    }

    .splitter:hover { background: #dfe5e9; }
    .splitter:hover::after { height: 56px; background: #89949d; }

    .chat-panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--line);
      background: #f8f9fa;
    }

    .chat-header {
      flex: 0 0 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 8px 0 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .chat-title-text {
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-title-text::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      vertical-align: 1px;
    }

    .collapse-chat {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
    }

    .collapse-chat:hover { background: var(--surface-muted); color: var(--text); }

    .chat-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 18px 16px 22px;
      background: #f8f9fa;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .chat-note {
      margin: 0 auto 16px;
      padding: 9px 11px;
      border: 1px solid #e4e8ec;
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .message {
      max-width: 88%;
      margin: 0 0 11px;
      padding: 10px 12px;
      border-radius: 11px;
      line-height: 1.48;
      font-size: 13px;
      box-shadow: 0 1px 1px rgba(31,35,40,.03);
    }

    .message.ai {
      margin-right: auto;
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
      background: #fff;
    }

    .message.user {
      margin-left: auto;
      border: 1px solid #cce5e7;
      border-bottom-right-radius: 4px;
      background: var(--accent-soft);
      color: #173f43;
    }

    .chat-composer {
      flex: 0 0 auto;
      padding: 10px 12px 12px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .composer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 8px;
    }

    .chat-input {
      width: 100%;
      min-height: 42px;
      max-height: 112px;
      padding: 10px 11px;
      resize: none;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color .12s ease, box-shadow .12s ease;
    }

    .chat-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(8,127,140,.10);
    }

    .send-button {
      min-height: 42px;
      padding: 0 14px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 650;
      transition: background .12s ease;
    }

    .send-button:hover { background: var(--accent-strong); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 18px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .status-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    @media (max-width: 980px) {
      :root { --chat-width: 38vw; }
      .tool-trigger { padding: 0 9px; }
      .section-scroll { padding: 22px 20px 36px; }
      .demo-blocks { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <button class="brand" id="brand-button" aria-label="Ir al Agente de Configuración"><span>L</span></button>

      <nav class="tool-row" id="tool-row" aria-label="Barra de herramientas"></nav>

      <div class="section-title-row">
        <h1 id="section-title">Agente de Configuración</h1>
      </div>

      <button class="profile-button" id="profile-button" aria-label="Abrir Mi cuenta">
        <span class="avatar">ME</span>
        <span class="profile-label">Perfil</span>
      </button>
    </header>

    <div class="workspace" id="workspace">
      <section class="section-panel" aria-label="Contenido de la sección">
        <nav class="section-tabs" id="section-tabs" aria-label="Pestañas de la sección" hidden></nav>
        <div class="section-scroll" id="section-scroll">
          <div class="section-inner" id="section-content"></div>
        </div>
      </section>

      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Ajustar ancho del chat"></div>

      <aside class="chat-panel" id="chat-panel" aria-label="Chat con la IA">
        <header class="chat-header">
          <div class="chat-title-text" id="chat-title">Agente de Configuración</div>
          <button class="collapse-chat" id="collapse-chat" aria-label="Plegar chat" title="Plegar o desplegar chat">‹</button>
        </header>
        <div class="chat-body" id="chat-body"></div>
        <div class="chat-composer">
          <div class="composer-row">
            <textarea class="chat-input" id="chat-input" rows="1" placeholder="Escribí un mensaje..."></textarea>
            <button class="send-button" id="send-button">Enviar</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    "use strict";

    const menus = [
      {
        label: "Análisis",
        items: [
          ["nueva-sesion", "Nueva sesión"],
          ["abrir-sesion", "Abrir sesión"],
          ["compartir-sesion", "Compartir sesión Lapex"],
          ["recibir-sesion", "Recibir sesión Lapex"]
        ]
      },
      {
        label: "Configuración",
        items: [
          ["agente-configuracion", "Agente de Configuración"],
          ["agentes-analisis", "Agentes de análisis"],
          ["circuitos", "Circuitos"],
          ["vehiculos", "Vehículos"],
          ["pilotos", "Pilotos"],
          ["skills-importacion", "Skills de importación de datos"],
          ["skills-representacion", "Skills de representación de datos"],
          ["skills-analisis", "Skills de análisis de datos"],
          ["skills-reportes", "Skills de reportes"]
        ]
      },
      {
        label: "Cuenta",
        items: [
          ["mi-cuenta", "Mi cuenta"],
          ["estadisticas-uso", "Estadísticas de uso"]
        ]
      },
      {
        label: "Ayuda",
        items: [
          ["asistente-ia", "Asistente IA"],
          ["faq", "FAQ"],
          ["contacto", "Contacto"],
          ["acerca", "Acerca de"]
        ]
      }
    ];

    const sections = Object.fromEntries(
      menus.flatMap(menu => menu.items.map(([id, label]) => [id, { id, label, group: menu.label }]))
    );

    const noChatSections = new Set([
      "faq",
      "contacto",
      "acerca",
      "mi-cuenta",
      "estadisticas-uso",
      "abrir-sesion",
      "compartir-sesion",
      "recibir-sesion"
    ]);

    const sectionTabs = {
      "agentes-analisis": ["Resumen", "Vehículos", "Sesiones", "Reportes", "Skills disponibles"]
    };

    const state = {
      section: "agente-configuracion",
      tabBySection: { "agentes-analisis": "Resumen" },
      chatCollapsed: false,
      messages: {}
    };

    const toolRow = document.getElementById("tool-row");
    const sectionTitle = document.getElementById("section-title");
    const sectionTabsEl = document.getElementById("section-tabs");
    const sectionContent = document.getElementById("section-content");
    const sectionScroll = document.getElementById("section-scroll");
    const workspace = document.getElementById("workspace");
    const splitter = document.getElementById("splitter");
    const chatTitle = document.getElementById("chat-title");
    const chatBody = document.getElementById("chat-body");
    const chatInput = document.getElementById("chat-input");
    const collapseChat = document.getElementById("collapse-chat");

    function renderMenus() {
      toolRow.innerHTML = menus.map((menu, index) => `
        <div class="tool-menu" data-menu-index="${index}">
          <button class="tool-trigger" aria-haspopup="true" aria-expanded="false">${menu.label}</button>
          <div class="tool-dropdown" role="menu">
            ${menu.items.map(([id, label]) => `<button class="tool-item" data-section="${id}" role="menuitem">${label}</button>`).join("")}
          </div>
        </div>
      `).join("");
    }

    function closeMenus(except = null) {
      document.querySelectorAll(".tool-menu").forEach(menu => {
        if (menu === except) return;
        menu.classList.remove("is-open");
        menu.querySelector(".tool-trigger")?.setAttribute("aria-expanded", "false");
      });
    }

    function getAgentName(sectionId) {
      if (sectionId === "asistente-ia") return "Asistente IA";
      if (["nueva-sesion", "skills-analisis", "skills-reportes"].includes(sectionId)) return "Agente de análisis";
      return "Agente de Configuración";
    }

    function getMessages(sectionId) {
      if (!state.messages[sectionId]) {
        const agent = getAgentName(sectionId);
        state.messages[sectionId] = [
          { role: "ai", text: `${agent}: esta conversación es una simulación visual de la maqueta.` },
          { role: "user", text: "Quiero trabajar sobre esta sección." },
          { role: "ai", text: "El contenido y las reglas específicas se definirán en próximas iteraciones." }
        ];
      }
      return state.messages[sectionId];
    }

    function renderTabs() {
      const tabs = sectionTabs[state.section];
      if (!tabs?.length) {
        sectionTabsEl.hidden = true;
        sectionTabsEl.innerHTML = "";
        return;
      }

      const active = state.tabBySection[state.section] || tabs[0];
      sectionTabsEl.hidden = false;
      sectionTabsEl.innerHTML = tabs.map(tab => `
        <button class="tab-button ${tab === active ? "is-active" : ""}" data-tab="${tab}">${tab}</button>
      `).join("");
    }

    function renderSectionContent() {
      const section = sections[state.section];
      const activeTab = state.tabBySection[state.section];
      const tabContext = activeTab ? ` · ${activeTab}` : "";

      sectionContent.innerHTML = `
        <p class="context-line">${section.group}${tabContext}</p>
        <h2>Área de trabajo</h2>
        <p class="lead">La estructura de esta sección ya está disponible para validar navegación, jerarquía y convivencia con el chat. Su contenido funcional se definirá en una iteración específica.</p>
        <div class="placeholder-card">
          <strong>Contenido de ${section.label} pendiente de definición</strong>
          <p>Acá se incorporarán controles, datos, formularios o resultados cuando trabajemos esta sección en detalle, sin alterar la estructura general.</p>
        </div>
        <div class="demo-blocks" aria-label="Zonas de contenido de demostración">
          <div class="demo-block">Zona de contenido</div>
          <div class="demo-block">Zona de acciones o información secundaria</div>
        </div>
        <span class="status-pill">Maqueta · datos simulados</span>
      `;
    }

    function renderChat() {
      const hasChat = !noChatSections.has(state.section);
      workspace.classList.toggle("no-chat", !hasChat);
      workspace.classList.toggle("chat-collapsed", hasChat && state.chatCollapsed);

      if (!hasChat) return;

      const agent = getAgentName(state.section);
      chatTitle.textContent = agent;
      chatBody.innerHTML = `
        <div class="chat-note">El chat es independiente del contenido central y conserva su propio scroll. El separador vertical permite ajustar su ancho.</div>
        ${getMessages(state.section).map(message => `<div class="message ${message.role}">${escapeHtml(message.text)}</div>`).join("")}
      `;
      chatBody.scrollTop = chatBody.scrollHeight;
      collapseChat.setAttribute("aria-label", state.chatCollapsed ? "Desplegar chat" : "Plegar chat");
    }

    function render() {
      const section = sections[state.section];
      sectionTitle.textContent = section.label;

      document.querySelectorAll(".tool-item").forEach(item => {
        item.classList.toggle("is-current", item.dataset.section === state.section);
      });

      document.querySelectorAll(".tool-menu").forEach(menuEl => {
        const menu = menus[Number(menuEl.dataset.menuIndex)];
        const ownsSection = menu.items.some(([id]) => id === state.section);
        menuEl.classList.toggle("is-current-group", ownsSection);
      });

      renderTabs();
      renderSectionContent();
      renderChat();
      sectionScroll.scrollTop = 0;
    }

    function setSection(id) {
      if (!sections[id]) return;
      state.section = id;
      closeMenus();
      render();
    }

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      })[char]);
    }

    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || noChatSections.has(state.section)) return;
      getMessages(state.section).push({ role: "user", text });
      getMessages(state.section).push({ role: "ai", text: "Respuesta simulada: esta sección todavía no tiene lógica funcional implementada." });
      chatInput.value = "";
      renderChat();
      chatInput.focus();
    }

    renderMenus();

    toolRow.addEventListener("click", event => {
      const trigger = event.target.closest(".tool-trigger");
      if (trigger) {
        const menu = trigger.closest(".tool-menu");
        const willOpen = !menu.classList.contains("is-open");
        closeMenus(menu);
        menu.classList.toggle("is-open", willOpen);
        trigger.setAttribute("aria-expanded", String(willOpen));
        return;
      }

      const item = event.target.closest("[data-section]");
      if (item) setSection(item.dataset.section);
    });

    sectionTabsEl.addEventListener("click", event => {
      const tab = event.target.closest("[data-tab]");
      if (!tab) return;
      state.tabBySection[state.section] = tab.dataset.tab;
      renderTabs();
      renderSectionContent();
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".tool-menu")) closeMenus();
    });

    document.getElementById("profile-button").addEventListener("click", () => setSection("mi-cuenta"));
    document.getElementById("brand-button").addEventListener("click", () => setSection("agente-configuracion"));

    collapseChat.addEventListener("click", () => {
      state.chatCollapsed = !state.chatCollapsed;
      renderChat();
    });

    document.getElementById("send-button").addEventListener("click", sendMessage);
    chatInput.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    splitter.addEventListener("pointerdown", event => {
      if (workspace.classList.contains("no-chat") || workspace.classList.contains("chat-collapsed")) return;
      event.preventDefault();
      splitter.setPointerCapture(event.pointerId);
      document.body.style.cursor = "col-resize";
      document.body.style.userSelect = "none";
    });

    splitter.addEventListener("pointermove", event => {
      if (!splitter.hasPointerCapture(event.pointerId)) return;
      const rect = workspace.getBoundingClientRect();
      const width = Math.max(280, Math.min(rect.width * .58, rect.right - event.clientX));
      document.documentElement.style.setProperty("--chat-width", `${Math.round(width)}px`);
    });

    function finishResize(event) {
      if (splitter.hasPointerCapture?.(event.pointerId)) splitter.releasePointerCapture(event.pointerId);
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
    }

    splitter.addEventListener("pointerup", finishResize);
    splitter.addEventListener("pointercancel", finishResize);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeMenus();
    });

    render();
  </script>
</body>
</html>
