<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Maqueta navegable de Lapex con datos ficticios.">
  <title>Lapex · Maqueta funcional</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6f8;
      --surface: #ffffff;
      --surface-subtle: #f8fafb;
      --sidebar: #14202b;
      --sidebar-hover: #1d2c39;
      --text: #17212b;
      --muted: #64717d;
      --line: #dfe6eb;
      --accent: #0f8fa3;
      --accent-dark: #0a6f7e;
      --accent-soft: #e4f5f7;
      --success: #247a4b;
      --success-soft: #e7f4ec;
      --warning: #9a6500;
      --warning-soft: #fff3d7;
      --shadow: 0 10px 30px rgba(31, 48, 61, 0.08);
      --radius: 16px;
      --sidebar-width: 256px;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 16px 18px;
      background: var(--sidebar);
      color: #fff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 10px 24px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(145deg, #19a8bd, #0c7383);
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .brand strong { display: block; font-size: 20px; letter-spacing: -.03em; }
    .brand small { color: #aebcc7; font-size: 11px; }

    .nav {
      display: grid;
      gap: 6px;
      margin-top: 22px;
    }

    .nav-button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: #c8d3dc;
      text-align: left;
      transition: background .16s ease, color .16s ease;
    }

    .nav-button:hover { background: var(--sidebar-hover); color: #fff; }
    .nav-button.is-active { background: rgba(24, 167, 188, .17); color: #fff; }
    .nav-button svg { width: 20px; height: 20px; flex: 0 0 auto; }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 10px 2px;
      border-top: 1px solid rgba(255,255,255,.1);
      color: #9cafbd;
      font-size: 12px;
      line-height: 1.45;
    }

    .content-shell { min-width: 0; }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 34px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
    }

    .breadcrumb { color: var(--muted); font-size: 14px; }
    .breadcrumb strong { color: var(--text); font-weight: 650; }

    .account-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px 6px 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 800;
    }

    main { padding: 34px; }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(28px, 3vw, 38px); line-height: 1.08; letter-spacing: -.04em; }
    .page-head p { max-width: 720px; margin: 10px 0 0; color: var(--muted); line-height: 1.55; }

    .primary-button, .secondary-button, .ghost-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 9px 15px;
      border-radius: 11px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .primary-button { background: var(--accent); color: #fff; }
    .primary-button:hover { background: var(--accent-dark); }
    .secondary-button { border-color: var(--line); background: var(--surface); color: var(--text); }
    .secondary-button:hover, .ghost-button:hover { border-color: #b9c5cd; background: var(--surface-subtle); }
    .ghost-button { border-color: transparent; background: transparent; color: var(--muted); }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto auto;
      gap: 12px;
      margin-bottom: 20px;
    }

    .control {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    .control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,143,163,.12); }
    input.control { width: 100%; padding: 0 14px; }
    select.control { padding: 0 36px 0 12px; }

    .summary-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .agent-card {
      display: flex;
      flex-direction: column;
      min-height: 250px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-top { display: flex; justify-content: space-between; gap: 16px; }
    .agent-card h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .agent-card .category { margin: 5px 0 0; color: var(--muted); font-size: 14px; }

    .status {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 7px;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status.ready { background: var(--success-soft); color: var(--success); }
    .status.pending { background: var(--warning-soft); color: var(--warning); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 22px 0;
    }

    .stat { padding: 11px; border-radius: 11px; background: var(--surface-subtle); }
    .stat strong { display: block; font-size: 18px; }
    .stat span { color: var(--muted); font-size: 12px; }

    .card-note {
      min-height: 44px;
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }

    .empty-state, .placeholder, .home-panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 390px;
      padding: 44px;
      text-align: center;
    }

    .empty-illustration {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin-bottom: 18px;
      border-radius: 24px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 30px;
    }

    .empty-state h2 { margin: 0; }
    .empty-state p { max-width: 520px; margin: 10px 0 22px; color: var(--muted); line-height: 1.55; }

    .home-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr); gap: 18px; }
    .home-panel { padding: 24px; }
    .home-panel h2 { margin: 0; font-size: 21px; }
    .home-panel p { color: var(--muted); line-height: 1.55; }

    .next-action {
      margin-top: 18px;
      padding: 18px;
      border-left: 4px solid var(--accent);
      border-radius: 0 12px 12px 0;
      background: var(--accent-soft);
    }

    .next-action strong { display: block; margin-bottom: 6px; }

    .mini-list { display: grid; gap: 12px; margin-top: 18px; }
    .mini-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .mini-row:last-child { padding-bottom: 0; border-bottom: 0; }
    .mini-row span { color: var(--muted); font-size: 13px; }

    .placeholder { padding: 40px; }
    .placeholder h2 { margin-top: 0; }
    .placeholder p { max-width: 680px; color: var(--muted); line-height: 1.6; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      max-width: 360px;
      padding: 13px 16px;
      border-radius: 12px;
      background: #16232d;
      color: #fff;
      box-shadow: 0 14px 40px rgba(0,0,0,.22);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 20;
    }

    .toast.is-visible { opacity: 1; transform: translateY(0); }

    .mobile-menu { display: none; }

    @media (max-width: 980px) {
      :root { --sidebar-width: 218px; }
      .cards { grid-template-columns: 1fr; }
      .home-grid { grid-template-columns: 1fr; }
      main { padding: 26px; }
      .topbar { padding: 0 26px; }
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(86vw, 290px);
        z-index: 30;
        transform: translateX(-102%);
        transition: transform .2s ease;
      }
      .sidebar.is-open { transform: translateX(0); }
      .mobile-menu { display: inline-flex; }
      .topbar { height: 64px; padding: 0 16px; }
      main { padding: 22px 16px; }
      .page-head { flex-direction: column; }
      .toolbar { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .account-chip .account-name { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">L</div>
        <div><strong>Lapex</strong><small>Maqueta navegable</small></div>
      </div>

      <nav class="nav" id="main-nav">
        <button class="nav-button" data-route="inicio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>
          Inicio
        </button>
        <button class="nav-button" data-route="configuracion">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5z"/><path d="M12 8v5M9.5 10.5h5"/></svg>
          Agente de Configuración
        </button>
        <button class="nav-button is-active" data-route="agentes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20c.7-4.2 3-6.3 7-6.3s6.3 2.1 7 6.3"/><path d="M4 7h2M18 7h2M12 2v2"/></svg>
          Agentes de Categoría
        </button>
        <button class="nav-button" data-route="skills">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3h8v4H8zM5 10h14v11H5z"/><path d="M9 14h6M9 17h4"/></svg>
          Skills
        </button>
        <button class="nav-button" data-route="recibido">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="m4 7 8 6 8-6"/></svg>
          Contenido recibido
        </button>
        <button class="nav-button" data-route="ayuda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.7 1.8c-1 .7-1.5 1.1-1.5 2.2M12 17h.01"/></svg>
          Ayuda
        </button>
        <button class="nav-button" data-route="cuenta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5.5 20c.8-4 3-6 6.5-6s5.7 2 6.5 6"/></svg>
          Cuenta
        </button>
      </nav>

      <div class="sidebar-footer">
        Prototipo estático<br>
        Datos exclusivamente ficticios
      </div>
    </aside>

    <div class="content-shell">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="secondary-button mobile-menu" id="mobile-menu" aria-label="Abrir menú">☰</button>
          <div class="breadcrumb">Lapex / <strong id="breadcrumb-current">Agentes de Categoría</strong></div>
        </div>
        <button class="account-chip" data-route="cuenta" aria-label="Abrir Cuenta">
          <span class="avatar">ME</span>
          <span class="account-name">Cuenta de prueba</span>
        </button>
      </header>

      <main id="main-content" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    const agents = [
      {
        id: "agt-tpg-01",
        name: "Turismo Pista Gol",
        category: "Categoría regional · Asfalto",
        status: "ready",
        vehicles: 1,
        sessions: 4,
        reports: 2,
        note: "Última actividad ficticia: análisis de tanda 3 en Autódromo Mar y Valle."
      },
      {
        id: "agt-track-02",
        name: "Track Day",
        category: "Prácticas libres · Asfalto",
        status: "pending",
        vehicles: 0,
        sessions: 0,
        reports: 0,
        note: "Falta agregar un vehículo para poder preparar la primera sesión."
      }
    ];

    const routeNames = {
      inicio: "Inicio",
      configuracion: "Agente de Configuración",
      agentes: "Agentes de Categoría",
      skills: "Skills",
      recibido: "Contenido recibido",
      ayuda: "Ayuda",
      cuenta: "Cuenta"
    };

    const state = {
      route: "agentes",
      query: "",
      status: "all",
      forceEmpty: false
    };

    const main = document.getElementById("main-content");
    const breadcrumb = document.getElementById("breadcrumb-current");
    const toast = document.getElementById("toast");
    const sidebar = document.getElementById("sidebar");
    let toastTimer;

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("is-visible");
      toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 2600);
    }

    function iconPlus() {
      return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
    }

    function pageHead(eyebrow, title, description, action = "") {
      return `
        <section class="page-head">
          <div>
            <p class="eyebrow">${eyebrow}</p>
            <h1>${title}</h1>
            <p>${description}</p>
          </div>
          ${action}
        </section>`;
    }

    function renderInicio() {
      main.innerHTML = `
        ${pageHead("Próxima acción útil", "Inicio", "Retomá el contexto más relevante sin convertir el inicio en un panel técnico indiscriminado.")}
        <div class="home-grid">
          <section class="home-panel">
            <h2>Continuar configuración</h2>
            <div class="next-action">
              <strong>Track Day necesita un vehículo</strong>
              <span>Completá la configuración pendiente antes de preparar una sesión de análisis.</span>
            </div>
            <div style="margin-top:20px">
              <button class="primary-button" data-route="agentes">Abrir Agentes de Categoría</button>
            </div>
          </section>
          <section class="home-panel">
            <h2>Contexto disponible</h2>
            <div class="mini-list">
              <div class="mini-row"><div>Agentes</div><strong>2</strong></div>
              <div class="mini-row"><div>Sesiones ficticias</div><strong>4</strong></div>
              <div class="mini-row"><div>Reportes ficticios</div><strong>2</strong></div>
              <div class="mini-row"><div>API de IA</div><span>Simulada como activa</span></div>
            </div>
          </section>
        </div>`;
    }

    function filteredAgents() {
      if (state.forceEmpty) return [];
      return agents.filter(agent => {
        const matchesQuery = `${agent.name} ${agent.category}`.toLowerCase().includes(state.query.toLowerCase());
        const matchesStatus = state.status === "all" || agent.status === state.status;
        return matchesQuery && matchesStatus;
      });
    }

    function agentCard(agent) {
      const ready = agent.status === "ready";
      return `
        <article class="agent-card">
          <div class="card-top">
            <div>
              <h2>${agent.name}</h2>
              <p class="category">${agent.category}</p>
            </div>
            <span class="status ${agent.status}">${ready ? "Listo" : "Configuración pendiente"}</span>
          </div>
          <div class="stats" aria-label="Resumen del agente">
            <div class="stat"><strong>${agent.vehicles}</strong><span>Vehículos</span></div>
            <div class="stat"><strong>${agent.sessions}</strong><span>Sesiones</span></div>
            <div class="stat"><strong>${agent.reports}</strong><span>Reportes</span></div>
          </div>
          <p class="card-note">${agent.note}</p>
          <div class="card-actions">
            <button class="secondary-button" data-open-agent="${agent.id}">${ready ? "Abrir agente" : "Completar configuración"}</button>
            <button class="ghost-button" data-more-agent="${agent.id}" aria-label="Más acciones para ${agent.name}">Más acciones</button>
          </div>
        </article>`;
    }

    function renderAgents() {
      const visibleAgents = filteredAgents();
      const action = `<button class="primary-button" id="create-agent">${iconPlus()} Crear agente</button>`;
      main.innerHTML = `
        ${pageHead("Configuración deportiva", "Agentes de Categoría", "Cada agente reúne los vehículos, sesiones, reportes y skills específicas de una categoría. Pilotos y pistas siguen perteneciendo a la cuenta.", action)}
        <section class="toolbar" aria-label="Buscar y filtrar agentes">
          <input class="control" id="agent-search" type="search" placeholder="Buscar por nombre o categoría" value="${state.query.replaceAll('"', '&quot;')}">
          <select class="control" id="status-filter" aria-label="Filtrar por estado">
            <option value="all" ${state.status === "all" ? "selected" : ""}>Todos los estados</option>
            <option value="ready" ${state.status === "ready" ? "selected" : ""}>Listos</option>
            <option value="pending" ${state.status === "pending" ? "selected" : ""}>Configuración pendiente</option>
          </select>
          <button class="secondary-button" id="toggle-empty">${state.forceEmpty ? "Ver datos" : "Probar estado vacío"}</button>
        </section>
        <div class="summary-strip">
          <span>${visibleAgents.length} ${visibleAgents.length === 1 ? "agente visible" : "agentes visibles"}</span>
          <span>Datos ficticios</span>
        </div>
        ${visibleAgents.length ? `<section class="cards">${visibleAgents.map(agentCard).join("")}</section>` : `
          <section class="empty-state">
            <div>
              <div class="empty-illustration" aria-hidden="true">⌁</div>
              <h2>No hay agentes para mostrar</h2>
              <p>${state.query || state.status !== "all" ? "No encontramos coincidencias con los filtros actuales. Podés limpiarlos o crear un agente nuevo." : "Creá un Agente de Categoría para organizar vehículos, sesiones, reportes y skills específicas."}</p>
              <button class="primary-button" id="empty-primary">${iconPlus()} Crear agente</button>
              ${(state.query || state.status !== "all") ? '<button class="ghost-button" id="clear-filters">Limpiar filtros</button>' : ''}
            </div>
          </section>`}`;

      document.getElementById("agent-search").addEventListener("input", event => {
        state.query = event.target.value;
        renderAgents();
        document.getElementById("agent-search").focus();
      });

      document.getElementById("status-filter").addEventListener("change", event => {
        state.status = event.target.value;
        renderAgents();
      });

      document.getElementById("toggle-empty").addEventListener("click", () => {
        state.forceEmpty = !state.forceEmpty;
        renderAgents();
      });

      document.getElementById("create-agent")?.addEventListener("click", simulateCreateAgent);
      document.getElementById("empty-primary")?.addEventListener("click", simulateCreateAgent);
      document.getElementById("clear-filters")?.addEventListener("click", () => {
        state.query = "";
        state.status = "all";
        state.forceEmpty = false;
        renderAgents();
      });

      document.querySelectorAll("[data-open-agent]").forEach(button => {
        button.addEventListener("click", () => showToast("Detalle del agente: previsto para una iteración posterior."));
      });

      document.querySelectorAll("[data-more-agent]").forEach(button => {
        button.addEventListener("click", () => showToast("Editar, desactivar, eliminar y enviar copia quedan fuera de esta iteración."));
      });
    }

    function simulateCreateAgent() {
      showToast("Flujo de creación simulado: el editor estructurado se incorporará en otra iteración.");
    }

    function renderConfigAgent() {
      main.innerHTML = `
        ${pageHead("Configuración asistida", "Agente de Configuración", "Creá, editá o recibí ayuda conversacional manteniendo el formulario estructurado como estado canónico.")}
        <section class="placeholder">
          <h2>Acceso disponible</h2>
          <p>Esta iteración incorpora el acceso desde la navegación principal. La conversación, el formulario estructurado y la confirmación de cambios se desarrollarán en una iteración específica.</p>
          <button class="primary-button" id="continue-configuration">Continuar configuración</button>
        </section>`;

      document.getElementById("continue-configuration").addEventListener("click", () => {
        showToast("Flujo del Agente de Configuración previsto para una próxima iteración.");
      });
    }

    function renderPlaceholder(route) {
      main.innerHTML = `
        ${pageHead("Navegación simulada", routeNames[route], "Esta superficie está identificada en el mapa documental, pero su contenido funcional queda expresamente fuera de la primera iteración.")}
        <section class="placeholder">
          <h2>Superficie reservada</h2>
          <p>La navegación ya permite verificar la arquitectura global. La pantalla se desarrollará cuando se consulte su flujo propietario y se acuerde la iteración correspondiente.</p>
          <button class="secondary-button" data-route="agentes">Volver a Agentes de Categoría</button>
        </section>`;
    }

    function render() {
      breadcrumb.textContent = routeNames[state.route];
      document.querySelectorAll(".nav-button").forEach(button => {
        button.classList.toggle("is-active", button.dataset.route === state.route);
      });

      if (state.route === "inicio") renderInicio();
      else if (state.route === "configuracion") renderConfigAgent();
      else if (state.route === "agentes") renderAgents();
      else renderPlaceholder(state.route);

      main.focus({ preventScroll: true });
    }

    document.addEventListener("click", event => {
      const routeControl = event.target.closest("[data-route]");
      if (!routeControl) return;
      const route = routeControl.dataset.route;
      if (!routeNames[route]) return;
      state.route = route;
      sidebar.classList.remove("is-open");
      render();
    });

    document.getElementById("mobile-menu").addEventListener("click", () => {
      sidebar.classList.toggle("is-open");
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") sidebar.classList.remove("is-open");
    });

    render();
  </script>
</body>
</html>
