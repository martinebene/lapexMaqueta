<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Maqueta funcional navegable de Lapex.">
<title>Lapex · Maqueta funcional</title>
<style>
:root{
  --tools-h:42px;--title-h:32px;--header-h:74px;--chat-w:34vw;
  --bg:#eef2f5;--surface:#fff;--surface-2:#f7f9fb;--surface-3:#e9eef2;
  --text:#111827;--muted:#475569;--line:#c7d0d9;--line-strong:#aeb9c4;
  --header:#131b24;--header-hover:#25313d;--title-bg:#075a63;
  --accent:#0b7c86;--accent-soft:#dff2f3;--shadow:0 14px 34px rgba(17,24,39,.18),0 3px 8px rgba(17,24,39,.1)
}
*{box-sizing:border-box}
html,body{width:100%;height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,textarea,select{font:inherit}button{cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #28a7b2;outline-offset:2px}
.shell{min-width:760px;min-height:100vh}
.app-header{position:fixed;inset:0 0 auto;z-index:200;display:grid;grid-template-columns:184px minmax(0,1fr) 132px;grid-template-rows:var(--tools-h) var(--title-h);height:var(--header-h);background:var(--header);box-shadow:0 2px 8px rgba(17,24,39,.18)}
.brand{grid-column:1;grid-row:1/3;display:flex;align-items:center;justify-content:center;padding:6px 12px 6px 14px;border:0;background:transparent}
.brand-logo{display:block;width:100%;max-width:160px;height:52px;object-fit:contain}
.brand:hover .brand-logo{filter:brightness(1.05)}
.tool-row{grid-column:2;grid-row:1;display:flex;align-items:stretch;min-width:0;padding-left:6px;padding-right:6px;gap:2px}
.tool-menu{position:relative;display:flex}
.tool-trigger{position:relative;min-width:max-content;height:var(--tools-h);padding:0 18px;margin-left:2px;margin-right:2px;border:0;border-radius:var(--title-h) var(--title-h) 0 0;background:transparent;color:#d8e0e8;font-size:13px;font-weight:610;white-space:nowrap}
.tool-trigger:hover,.tool-menu.is-open .tool-trigger{background:var(--header-hover);color:#fff}
.tool-menu.is-current-group .tool-trigger{background:var(--title-bg);color:#fff}
.tool-menu.is-current-group .tool-trigger::before{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#4cc2ca}
.tool-trigger::after{content:"";display:inline-block;width:6px;height:6px;margin:0 0 3px 7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg)}
.tool-dropdown{position:absolute;top:100%;left:0;z-index:500;display:none;width:max-content;min-width:100%;max-width:min(440px,72vw);padding:7px;border:1px solid var(--line-strong);border-radius:0 0 10px 10px;background:#fff;box-shadow:var(--shadow)}
.tool-menu.is-open .tool-dropdown{display:grid}
.tool-item{width:100%;min-width:max-content;min-height:38px;padding:8px 12px;border:0;border-radius:6px;background:transparent;color:var(--text);font-size:13px;font-weight:520;text-align:left;white-space:nowrap}
.tool-item:hover{background:var(--surface-3)}
.tool-item.is-current{background:var(--accent-soft);color:#034c53;font-weight:700}
.section-title-row{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;min-width:0;padding:0 24px;background:var(--title-bg);color:#fff;text-align:center;border-radius:var(--title-h) var(--title-h) 0 0;box-shadow:inset 0 1px rgba(255,255,255,.06)}
.section-title-row h1{width:100%;overflow:hidden;margin:0;color:#fff;font-size:16px;font-weight:720;letter-spacing:-.015em;line-height:1.1;text-align:center;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.14)}
.profile-button{grid-column:3;grid-row:1/3;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 14px 0 10px;border:0;background:transparent;color:#fff}
.profile-button:hover{background:var(--header-hover)}
.profile-photo{display:block;width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.78);box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.profile-name{color:#e8eef3;font-size:12px;font-weight:680;letter-spacing:.01em}
.workspace{position:fixed;inset:var(--header-h) 0 0;display:grid;grid-template-columns:minmax(0,1fr) 6px minmax(280px,var(--chat-w));overflow:hidden;background:var(--bg)}
.workspace.no-chat{grid-template-columns:minmax(0,1fr)}
.workspace.no-chat .splitter,.workspace.no-chat .chat-panel{display:none}
.workspace.chat-collapsed{grid-template-columns:minmax(0,1fr) 0 44px}
.workspace.chat-collapsed .splitter,.workspace.chat-collapsed .chat-body,.workspace.chat-collapsed .chat-composer,.workspace.chat-collapsed .chat-title-text{display:none}
.workspace.chat-collapsed .chat-header{height:100%;padding:10px 5px;flex-direction:column;justify-content:flex-start;border-left:1px solid var(--line-strong);background:#e7edf1}
.workspace.chat-collapsed .chat-header::after{content:"IA";margin-top:12px;color:#334155;font-size:10px;font-weight:800;letter-spacing:.08em;writing-mode:vertical-rl}
.workspace.chat-collapsed .collapse-chat{transform:rotate(180deg)}
.section-panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff}
.section-tabs{flex:0 0 auto;min-height:44px;display:flex;align-items:end;gap:3px;padding:0 18px;border-bottom:1px solid var(--line-strong);background:var(--surface-3)}
.section-tabs[hidden]{display:none}
.tab-button{height:43px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;color:#374151;font-size:13px;font-weight:650}
.tab-button:hover{background:rgba(255,255,255,.55);color:#111827}
.tab-button.is-active{border-bottom-color:var(--accent);background:#fff;color:#073f45}
.section-scroll{flex:1 1 auto;min-height:0;overflow:auto;padding:30px 32px 44px;background:#fff;overscroll-behavior:contain;scrollbar-gutter:stable}
.section-inner{max-width:1040px;margin:auto}
.context-line{margin:0 0 12px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.section-inner h2{margin:0 0 8px;color:#0f172a;font-size:23px;font-weight:720;letter-spacing:-.025em}
.lead{max-width:720px;margin:0 0 24px;color:var(--muted);line-height:1.6}
.placeholder-card{padding:22px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2)}
.placeholder-card strong{display:block;margin-bottom:6px;font-weight:700}.placeholder-card p{margin:0;color:var(--muted);line-height:1.55}
.demo-blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.demo-block{min-height:96px;padding:16px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);font-size:12px}
.status-pill{display:inline-flex;align-items:center;gap:7px;margin-top:18px;padding:5px 9px;border:1px solid #b8c3cc;border-radius:999px;background:#f8fafc;color:var(--muted);font-size:11px;font-weight:650}
.status-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.splitter{position:relative;z-index:20;background:#d6dde3;cursor:col-resize;touch-action:none}
.splitter::after{content:"";position:absolute;top:50%;left:2px;width:2px;height:48px;border-radius:99px;background:#8996a3;transform:translateY(-50%)}
.splitter:hover{background:#aeb9c4}.splitter:hover::after{background:#52606d}
.chat-panel{min-width:0;min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line-strong);background:#eef3f6}
.chat-header{flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 9px 0 15px;border-bottom:1px solid var(--line-strong);background:#e4eaee}
.chat-title-text{min-width:0;overflow:hidden;color:#17212b;font-size:13px;font-weight:750;text-overflow:ellipsis;white-space:nowrap}
.chat-title-text::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #c8e8ea;vertical-align:1px}
.collapse-chat{display:grid;place-items:center;width:30px;height:30px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--muted);font-size:18px}
.collapse-chat:hover{border-color:var(--line-strong);background:#fff;color:#111827}
.chat-body{flex:1 1 auto;min-height:0;overflow:auto;padding:18px 16px 22px;background:#eef3f6;overscroll-behavior:contain;scrollbar-gutter:stable}
.chat-note{margin-bottom:16px;padding:10px 12px;border:1px solid #c8d4dc;border-radius:8px;background:#fff;color:var(--muted);font-size:11px;line-height:1.45}
.message{width:fit-content;max-width:min(90%,540px);margin-bottom:10px;padding:10px 12px;border-radius:10px;color:#17212b;line-height:1.48;font-size:13px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.message.ai{margin-right:auto;border:1px solid #c2ccd5;border-bottom-left-radius:4px;background:#fff}
.message.user{margin-left:auto;border:1px solid #99cdd1;border-bottom-right-radius:4px;background:#d9eff1;color:#083f44}
.chat-composer{flex:0 0 auto;padding:11px 12px 12px;border-top:1px solid var(--line-strong);background:#e4eaee}
.chat-settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{color:#334155;font-size:11px;font-weight:680;letter-spacing:.015em}
.field select{height:36px;padding:0 10px;border:1px solid #9eabb7;border-radius:8px;background:#fff;color:var(--text)}
.composer-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px}
.chat-input{width:100%;min-height:78px;max-height:170px;padding:10px 11px;resize:vertical;border:1px solid #9eabb7;border-radius:8px;background:#fff;color:var(--text)}
.chat-input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,124,134,.16)}
.send-button{min-height:42px;padding:0 15px;border:0;border-radius:8px;background:var(--title-bg);color:#fff;font-size:12px;font-weight:720}
.send-button:hover{background:#034d55}
@media(max-width:980px){
  :root{--chat-w:38vw}
  .app-header{grid-template-columns:154px minmax(0,1fr) 112px}
  .brand-logo{max-width:136px;height:44px}
  .tool-trigger{padding:0 14px}
  .section-title-row{padding:0 18px}
  .section-scroll{padding:24px 22px 38px}
  .demo-blocks{grid-template-columns:1fr}
  .profile-name{display:none}
  .chat-settings{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="shell">
  <header class="app-header">
    <button class="brand" id="brand-button" aria-label="Ir al Agente de Configuración">
      <img class="brand-logo" src="assets/lapex-logo.svg" alt="Lapex.ai">
    </button>
    <nav class="tool-row" id="tool-row" aria-label="Barra de herramientas"></nav>
    <div class="section-title-row"><h1 id="section-title">Agente de Configuración</h1></div>
    <button class="profile-button" id="profile-button" aria-label="Abrir Mi cuenta">
      <img class="profile-photo" src="assets/profile-mebene.jpg" alt="Foto de perfil de mebene">
      <span class="profile-name">mebene</span>
    </button>
  </header>
  <div class="workspace" id="workspace">
    <section class="section-panel" aria-label="Contenido de la sección">
      <nav class="section-tabs" id="section-tabs" aria-label="Pestañas de la sección" hidden></nav>
      <div class="section-scroll" id="section-scroll"><div class="section-inner" id="section-content"></div></div>
    </section>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Ajustar ancho del chat"></div>
    <aside class="chat-panel" id="chat-panel" aria-label="Chat con la IA">
      <header class="chat-header"><div class="chat-title-text" id="chat-title">Agente de Configuración</div><button class="collapse-chat" id="collapse-chat" aria-label="Plegar chat" title="Plegar o desplegar chat">‹</button></header>
      <div class="chat-body" id="chat-body"></div>
      <div class="chat-composer">
        <div class="chat-settings">
          <div class="field">
            <label for="model-select">Modelo de IA</label>
            <select id="model-select">
              <option>Lapex Core</option>
              <option>Lapex Fast</option>
              <option>Lapex Deep</option>
            </select>
          </div>
          <div class="field">
            <label for="reasoning-select">Nivel de razonamiento</label>
            <select id="reasoning-select">
              <option>Bajo</option>
              <option selected>Medio</option>
              <option>Alto</option>
            </select>
          </div>
        </div>
        <div class="composer-row">
          <textarea class="chat-input" id="chat-input" rows="3" placeholder="Escribí un mensaje..."></textarea>
          <button class="send-button" id="send-button">Enviar</button>
        </div>
      </div>
    </aside>
  </div>
</div>
<script>
"use strict";
const menus=[
  {label:"Análisis",items:[["nueva-sesion","Nueva sesión"],["abrir-sesion","Abrir sesión"],["compartir-sesion","Compartir sesión Lapex"],["recibir-sesion","Recibir sesión Lapex"]]},
  {label:"Configuración",items:[["agente-configuracion","Agente de Configuración"],["agentes-analisis","Agentes de análisis"],["circuitos","Circuitos"],["vehiculos","Vehículos"],["pilotos","Pilotos"],["skills-importacion","Skills de importación de datos"],["skills-representacion","Skills de representación de datos"],["skills-analisis","Skills de análisis de datos"],["skills-reportes","Skills de reportes"]]},
  {label:"Cuenta",items:[["mi-cuenta","Mi cuenta"],["estadisticas-uso","Estadísticas de uso"]]},
  {label:"Ayuda",items:[["asistente-ia","Asistente IA"],["faq","FAQ"],["contacto","Contacto"],["acerca","Acerca de"]]}
];
const sections=Object.fromEntries(menus.flatMap(menu=>menu.items.map(([id,label])=>[id,{id,label,group:menu.label}])));
const noChatSections=new Set(["faq","contacto","acerca","mi-cuenta","estadisticas-uso","abrir-sesion","compartir-sesion","recibir-sesion"]);
const sectionTabs={"agentes-analisis":["Resumen","Vehículos","Sesiones","Reportes","Skills disponibles"]};
const state={section:"agente-configuracion",tabBySection:{"agentes-analisis":"Resumen"},chatCollapsed:false,messages:{}};
const toolRow=document.getElementById("tool-row"),sectionTitle=document.getElementById("section-title"),sectionTabsEl=document.getElementById("section-tabs"),sectionContent=document.getElementById("section-content"),sectionScroll=document.getElementById("section-scroll"),workspace=document.getElementById("workspace"),splitter=document.getElementById("splitter"),chatTitle=document.getElementById("chat-title"),chatBody=document.getElementById("chat-body"),chatInput=document.getElementById("chat-input"),collapseChat=document.getElementById("collapse-chat"),modelSelect=document.getElementById("model-select"),reasoningSelect=document.getElementById("reasoning-select");
function escapeHtml(v){return v.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll("\"","&quot;").replaceAll("'","&#39;")}
function renderMenus(){toolRow.innerHTML=menus.map((menu,index)=>`<div class="tool-menu" data-menu-index="${index}"><button class="tool-trigger" aria-haspopup="true" aria-expanded="false">${menu.label}</button><div class="tool-dropdown" role="menu">${menu.items.map(([id,label])=>`<button class="tool-item" data-section="${id}" role="menuitem">${label}</button>`).join("")}</div></div>`).join("")}
function closeMenus(except=null){document.querySelectorAll(".tool-menu").forEach(menu=>{if(menu===except)return;menu.classList.remove("is-open");menu.querySelector(".tool-trigger")?.setAttribute("aria-expanded","false")})}
function getAgentName(id){if(id==="asistente-ia")return"Asistente IA";if(["nueva-sesion","skills-analisis","skills-reportes"].includes(id))return"Agente de análisis";return"Agente de Configuración"}
function getMessages(id){
  if(!state.messages[id]){
    const agent=getAgentName(id);
    state.messages[id]=[
      {role:"ai",text:`${agent}: esta conversación es una simulación visual de la maqueta.`},
      {role:"user",text:"Quiero trabajar sobre esta sección."},
      {role:"ai",text:"El contenido y las reglas específicas se definirán en próximas iteraciones."}
    ];
  }
  return state.messages[id];
}
function renderTabs(){
  const tabs=sectionTabs[state.section];
  if(!tabs?.length){sectionTabsEl.hidden=true;sectionTabsEl.innerHTML="";return}
  const active=state.tabBySection[state.section]||tabs[0];
  sectionTabsEl.hidden=false;
  sectionTabsEl.innerHTML=tabs.map(tab=>`<button class="tab-button ${tab===active?"is-active":""}" data-tab="${tab}">${tab}</button>`).join("");
}
function renderSectionContent(){
  const section=sections[state.section],activeTab=state.tabBySection[state.section],tabContext=activeTab?` · ${activeTab}`:"";
  sectionContent.innerHTML=`<p class="context-line">${section.group}${tabContext}</p><h2>${section.label}</h2><p class="lead">Esta iteración sigue enfocada en la estructura global, la navegación y los componentes persistentes. El selector de modelo y el nivel de razonamiento dentro del chat son propuestas reversibles de maqueta.</p><div class="placeholder-card"><strong>Superficie reservada</strong><p>Acá se incorporarán controles, datos, formularios o resultados propios de <b>${section.label}</b> cuando trabajemos esta sección en detalle.</p></div><div class="demo-blocks"><div class="demo-block">Bloque de contenido demostrativo 1</div><div class="demo-block">Bloque de contenido demostrativo 2</div><div class="demo-block">Bloque de contenido demostrativo 3</div></div><span class="status-pill">Datos y acciones simuladas</span>`;
}
function renderChat(){
  const hasChat=!noChatSections.has(state.section);
  workspace.classList.toggle("no-chat",!hasChat);
  workspace.classList.toggle("chat-collapsed",hasChat&&state.chatCollapsed);
  if(!hasChat)return;
  const agent=getAgentName(state.section);
  chatTitle.textContent=agent;
  chatBody.innerHTML=`<div class="chat-note">El chat es independiente del contenido central, conserva su propio scroll y permite ajustar su ancho. El modelo y el nivel de razonamiento son configuraciones demostrativas.</div>${getMessages(state.section).map(m=>`<div class="message ${m.role}">${escapeHtml(m.text)}</div>`).join("")}`;
  chatBody.scrollTop=chatBody.scrollHeight;
  collapseChat.setAttribute("aria-label",state.chatCollapsed?"Desplegar chat":"Plegar chat");
}
function render(){
  const section=sections[state.section];
  sectionTitle.textContent=section.label;
  document.querySelectorAll(".tool-item").forEach(item=>item.classList.toggle("is-current",item.dataset.section===state.section));
  document.querySelectorAll(".tool-menu").forEach(el=>{const menu=menus[Number(el.dataset.menuIndex)];el.classList.toggle("is-current-group",menu.items.some(([id])=>id===state.section))});
  renderTabs();renderSectionContent();renderChat();sectionScroll.scrollTop=0;
}
function setSection(id){if(!sections[id])return;state.section=id;closeMenus();render()}
function sendMessage(){
  const text=chatInput.value.trim();
  if(!text||noChatSections.has(state.section))return;
  const suffix=`Modelo: ${modelSelect.value} · Razonamiento: ${reasoningSelect.value}`;
  getMessages(state.section).push({role:"user",text},{role:"ai",text:`Respuesta simulada: ${suffix}. Esta sección todavía no tiene lógica funcional implementada.`});
  chatInput.value="";renderChat();chatInput.focus();
}
renderMenus();
toolRow.addEventListener("click",event=>{const trigger=event.target.closest(".tool-trigger");if(trigger){const menu=trigger.closest(".tool-menu"),willOpen=!menu.classList.contains("is-open");closeMenus(menu);menu.classList.toggle("is-open",willOpen);trigger.setAttribute("aria-expanded",String(willOpen));return}const item=event.target.closest("[data-section]");if(item)setSection(item.dataset.section)});
sectionTabsEl.addEventListener("click",event=>{const tab=event.target.closest("[data-tab]");if(!tab)return;state.tabBySection[state.section]=tab.dataset.tab;renderTabs();renderSectionContent()});
document.addEventListener("click",event=>{if(!event.target.closest(".tool-menu"))closeMenus()});
document.getElementById("profile-button").addEventListener("click",()=>setSection("mi-cuenta"));
document.getElementById("brand-button").addEventListener("click",()=>setSection("agente-configuracion"));
collapseChat.addEventListener("click",()=>{state.chatCollapsed=!state.chatCollapsed;renderChat()});
document.getElementById("send-button").addEventListener("click",sendMessage);
chatInput.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();sendMessage()}});
splitter.addEventListener("pointerdown",event=>{if(workspace.classList.contains("no-chat")||workspace.classList.contains("chat-collapsed"))return;event.preventDefault();splitter.setPointerCapture(event.pointerId);document.body.style.cursor="col-resize";document.body.style.userSelect="none"});
splitter.addEventListener("pointermove",event=>{if(!splitter.hasPointerCapture(event.pointerId))return;const rect=workspace.getBoundingClientRect();const width=Math.max(280,Math.min(rect.width*.58,rect.right-event.clientX));document.documentElement.style.setProperty("--chat-w",`${Math.round(width)}px`)});
function finishResize(event){if(splitter.hasPointerCapture?.(event.pointerId))splitter.releasePointerCapture(event.pointerId);document.body.style.cursor="";document.body.style.userSelect=""}
splitter.addEventListener("pointerup",finishResize);splitter.addEventListener("pointercancel",finishResize);
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeMenus()});
render();
</script>
</body>
</html>
