<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lapex · Maqueta</title><style>
:root{--tools:42px;--title:32px;--head:74px;--chat:34vw;--dark:#131b24;--dark2:#25313d;--teal:#075a63;--accent:#0b7c86;--soft:#dff2f3;--bg:#eef2f5;--panel:#fff;--chatbg:#eef3f6;--line:#aeb9c4;--muted:#475569;--text:#111827;--shadow:0 14px 34px #1118272e}*{box-sizing:border-box}html,body{width:100%;height:100%}body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid #29a7b2;outline-offset:2px}.shell{min-width:760px;min-height:100vh}.app-header{position:fixed;inset:0 0 auto;z-index:200;display:grid;grid-template-columns:110px minmax(0,1fr) 96px;grid-template-rows:var(--tools) var(--title);height:var(--head);background:var(--dark);box-shadow:0 2px 8px #1118272e}.brand{grid-column:1;grid-row:1/3;display:flex;align-items:center;padding:0 14px 0 18px;border:0;background:transparent;color:#fff}.brand span{font-size:20px;font-weight:760;letter-spacing:-.045em}.brand:hover span{color:#7ed8dd}.tools{grid-column:2;grid-row:1;display:flex;min-width:0;padding-left:4px}.menu{position:relative;display:flex}.trigger{position:relative;width:max-content;height:var(--tools);padding:0 13px;border:0;background:transparent;color:#d8e0e8;font-size:13px;font-weight:610;white-space:nowrap}.trigger:hover,.menu.open .trigger,.menu.current .trigger{background:var(--dark2);color:#fff}.menu.current .trigger:before{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:#4cc2ca;border-radius:3px 3px 0 0}.trigger:after{content:"";display:inline-block;width:6px;height:6px;margin:0 0 3px 7px;border-right:1.5px solid;border-bottom:1.5px solid;transform:rotate(45deg)}.dropdown{position:absolute;top:100%;left:0;z-index:500;display:none;width:max-content;min-width:100%;padding:7px;border:1px solid var(--line);border-radius:0 0 10px 10px;background:#fff;box-shadow:var(--shadow)}.menu.open .dropdown{display:grid}.item{min-width:max-content;min-height:38px;padding:8px 12px;border:0;border-radius:6px;background:transparent;color:var(--text);text-align:left;white-space:nowrap}.item:hover{background:#e9eef2}.item.active{background:var(--soft);color:#034c53;font-weight:700}.titlebar{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;min-width:0;padding:0 24px;background:var(--teal);box-shadow:inset 0 1px #ffffff10}.titlebar h1{width:100%;overflow:hidden;margin:0;color:#fff;font-size:16px;font-weight:720;letter-spacing:-.015em;text-align:center;text-overflow:ellipsis;white-space:nowrap}.profile{grid-column:3;grid-row:1/3;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border:0;background:transparent;color:#fff}.profile:hover{background:var(--dark2)}.avatar{display:grid;place-items:center;width:34px;height:34px;border:2px solid #ffffffd1;border-radius:50%;background:var(--soft);color:#034c53;font-size:9px;font-weight:800}.profile small{color:#e8eef3;font-size:11px;font-weight:600}.work{position:fixed;inset:var(--head) 0 0;display:grid;grid-template-columns:minmax(0,1fr) 6px minmax(280px,var(--chat));overflow:hidden}.work.nochat{grid-template-columns:1fr}.work.nochat .split,.work.nochat .chat{display:none}.work.fold{grid-template-columns:minmax(0,1fr) 0 44px}.work.fold .split,.work.fold .chatbody,.work.fold .composer,.work.fold .chatname{display:none}.work.fold .chathead{height:100%;padding:10px 5px;flex-direction:column;justify-content:flex-start;background:#e7edf1}.work.fold .chathead:after{content:"IA";margin-top:12px;color:#334155;font-size:10px;font-weight:800;letter-spacing:.08em;writing-mode:vertical-rl}.work.fold .foldbtn{transform:rotate(180deg)}.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff}.tabs{flex:0 0 auto;min-height:44px;display:flex;align-items:end;gap:3px;padding:0 18px;border-bottom:1px solid var(--line);background:#e9eef2}.tabs[hidden]{display:none}.tab{height:43px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;color:#374151;font-weight:650}.tab:hover{background:#ffffff8c}.tab.active{border-bottom-color:var(--accent);background:#fff;color:#073f45}.scroll{flex:1;min-height:0;overflow:auto;padding:30px 32px 44px;scrollbar-gutter:stable}.inner{max-width:1040px;margin:auto}.context{margin:0 0 12px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}.inner h2{margin:0 0 8px;font-size:23px}.lead{max-width:720px;margin:0 0 24px;color:var(--muted);line-height:1.6}.card{padding:22px;border:1px solid var(--line);border-radius:10px;background:#f7f9fb}.card strong{display:block;margin-bottom:6px}.card p{margin:0;color:var(--muted);line-height:1.55}.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.block{min-height:96px;padding:16px;border:1px solid #c7d0d9;border-radius:9px;color:var(--muted)}.split{position:relative;background:#d6dde3;cursor:col-resize;touch-action:none}.split:after{content:"";position:absolute;top:50%;left:2px;width:2px;height:48px;background:#8996a3;transform:translateY(-50%)}.split:hover{background:#aeb9c4}.chat{min-width:0;min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--chatbg)}.chathead{flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;padding:0 9px 0 15px;border-bottom:1px solid var(--line);background:#e4eaee}.chatname{overflow:hidden;font-size:13px;font-weight:750;text-overflow:ellipsis;white-space:nowrap}.chatname:before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #c8e8ea}.foldbtn{width:30px;height:30px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:18px}.foldbtn:hover{background:#fff}.chatbody{flex:1;min-height:0;overflow:auto;padding:18px 16px 22px;scrollbar-gutter:stable}.note{margin-bottom:16px;padding:10px 12px;border:1px solid #c8d4dc;border-radius:8px;background:#fff;color:var(--muted);font-size:11px}.msg{width:fit-content;max-width:90%;margin-bottom:10px;padding:10px 12px;border:1px solid #c2ccd5;border-radius:10px;background:#fff;line-height:1.48}.msg.user{margin-left:auto;border-color:#99cdd1;background:#d9eff1;color:#083f44}.composer{padding:11px 12px 12px;border-top:1px solid var(--line);background:#e4eaee}.compose{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.input{min-height:42px;max-height:112px;padding:10px 11px;resize:none;border:1px solid #9eabb7;border-radius:8px}.send{min-height:42px;padding:0 15px;border:0;border-radius:8px;background:var(--teal);color:#fff;font-weight:720}.send:hover{background:#034d55}@media(max-width:980px){:root{--chat:38vw}.app-header{grid-template-columns:92px minmax(0,1fr) 74px}.brand{padding-left:12px}.brand span{font-size:18px}.trigger{padding:0 9px}.titlebar{padding:0 18px}.scroll{padding:24px 22px 38px}.blocks{grid-template-columns:1fr}.profile small{display:none}}
</style></head><body><div class="shell"><header class="app-header"><button class="brand" id="brand"><span>Lapex</span></button><nav class="tools" id="tools"></nav><div class="titlebar"><h1 id="title">Agente de Configuración</h1></div><button class="profile" id="profile"><span class="avatar">ME</span><small>Perfil</small></button></header><div class="work" id="work"><section class="main"><nav class="tabs" id="tabs" hidden></nav><div class="scroll" id="scroll"><div class="inner" id="content"></div></div></section><div class="split" id="split"></div><aside class="chat"><header class="chathead"><div class="chatname" id="chatname">Agente de Configuración</div><button class="foldbtn" id="fold">‹</button></header><div class="chatbody" id="chatbody"></div><div class="composer"><div class="compose"><textarea class="input" id="input" rows="1" placeholder="Escribí un mensaje..."></textarea><button class="send" id="send">Enviar</button></div></div></aside></div></div><script>
"use strict";const menus=[{label:"Análisis",items:[["nueva-sesion","Nueva sesión"],["abrir-sesion","Abrir sesión"],["compartir-sesion","Compartir sesión Lapex"],["recibir-sesion","Recibir sesión Lapex"]]},{label:"Configuración",items:[["agente-configuracion","Agente de Configuración"],["agentes-analisis","Agentes de análisis"],["circuitos","Circuitos"],["vehiculos","Vehículos"],["pilotos","Pilotos"],["skills-importacion","Skills de importación de datos"],["skills-representacion","Skills de representación de datos"],["skills-analisis","Skills de análisis de datos"],["skills-reportes","Skills de reportes"]]},{label:"Cuenta",items:[["mi-cuenta","Mi cuenta"],["estadisticas-uso","Estadísticas de uso"]]},{label:"Ayuda",items:[["asistente-ia","Asistente IA"],["faq","FAQ"],["contacto","Contacto"],["acerca","Acerca de"]]}],sections=Object.fromEntries(menus.flatMap(m=>m.items.map(([id,label])=>[id,{id,label,group:m.label}]))),noChat=new Set(["faq","contacto","acerca","mi-cuenta","estadisticas-uso","abrir-sesion","compartir-sesion","recibir-sesion"]),tabsBy={"agentes-analisis":["Resumen","Vehículos","Sesiones","Reportes","Skills disponibles"]},state={section:"agente-configuracion",tab:{"agentes-analisis":"Resumen"},fold:false,msg:{}};const $=id=>document.getElementById(id),tools=$("tools"),title=$("title"),tabs=$("tabs"),content=$("content"),scroll=$("scroll"),work=$("work"),split=$("split"),chatname=$("chatname"),chatbody=$("chatbody"),input=$("input");
function menusRender(){tools.innerHTML=menus.map((m,i)=>`<div class="menu" data-i="${i}"><button class="trigger">${m.label}</button><div class="dropdown">${m.items.map(([id,l])=>`<button class="item" data-section="${id}">${l}</button>`).join("")}</div></div>`).join("")}function close(ex=null){document.querySelectorAll(".menu").forEach(m=>{if(m!==ex)m.classList.remove("open")})}function agent(id){if(id==="asistente-ia")return"Asistente IA";if(["nueva-sesion","skills-analisis","skills-reportes"].includes(id))return"Agente de análisis";return"Agente de Configuración"}function msgs(id){return state.msg[id]??=[{role:"ai",text:`${agent(id)}: conversación simulada de la maqueta.`},{role:"user",text:"Quiero trabajar sobre esta sección."},{role:"ai",text:"El contenido específico se definirá en próximas iteraciones."}]}function esc(s){return s.replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#39;"})[c])}
function renderTabs(){const a=tabsBy[state.section];if(!a){tabs.hidden=true;tabs.innerHTML="";return}tabs.hidden=false;const act=state.tab[state.section]||a[0];tabs.innerHTML=a.map(t=>`<button class="tab ${t===act?"active":""}" data-tab="${t}">${t}</button>`).join("")}function renderContent(){const s=sections[state.section],t=state.tab[state.section];content.innerHTML=`<p class="context">${s.group}${t?` · ${t}`:""}</p><h2>Área de trabajo</h2><p class="lead">La estructura de esta sección está disponible para validar navegación y convivencia con el chat. Su contenido funcional se definirá en una iteración específica.</p><div class="card"><strong>Contenido de ${s.label} pendiente de definición</strong><p>Acá se incorporarán controles, datos, formularios o resultados sin alterar la estructura general.</p></div><div class="blocks"><div class="block">Zona de contenido</div><div class="block">Zona de acciones o información secundaria</div></div>`}function renderChat(){const has=!noChat.has(state.section);work.classList.toggle("nochat",!has);work.classList.toggle("fold",has&&state.fold);if(!has)return;chatname.textContent=agent(state.section);chatbody.innerHTML=`<div class="note">El chat conserva scroll independiente y puede redimensionarse o plegarse.</div>${msgs(state.section).map(m=>`<div class="msg ${m.role}">${esc(m.text)}</div>`).join("")}`;chatbody.scrollTop=chatbody.scrollHeight}
function render(){const s=sections[state.section];title.textContent=s.label;document.querySelectorAll(".item").forEach(x=>x.classList.toggle("active",x.dataset.section===state.section));document.querySelectorAll(".menu").forEach(x=>x.classList.toggle("current",menus[+x.dataset.i].items.some(([id])=>id===state.section)));renderTabs();renderContent();renderChat();scroll.scrollTop=0}function setSection(id){if(!sections[id])return;state.section=id;close();render()}function send(){const t=input.value.trim();if(!t||noChat.has(state.section))return;msgs(state.section).push({role:"user",text:t},{role:"ai",text:"Respuesta simulada: esta sección todavía no tiene lógica funcional."});input.value="";renderChat();input.focus()}
menusRender();tools.onclick=e=>{const tr=e.target.closest(".trigger");if(tr){const m=tr.closest(".menu"),o=!m.classList.contains("open");close(m);m.classList.toggle("open",o);return}const it=e.target.closest("[data-section]");if(it)setSection(it.dataset.section)};tabs.onclick=e=>{const t=e.target.closest("[data-tab]");if(t){state.tab[state.section]=t.dataset.tab;renderTabs();renderContent()}};document.onclick=e=>{if(!e.target.closest(".menu"))close()};$("brand").onclick=()=>setSection("agente-configuracion");$("profile").onclick=()=>setSection("mi-cuenta");$("fold").onclick=()=>{state.fold=!state.fold;renderChat()};$("send").onclick=send;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};split.onpointerdown=e=>{if(work.classList.contains("nochat")||work.classList.contains("fold"))return;e.preventDefault();split.setPointerCapture(e.pointerId);document.body.style.cursor="col-resize"};split.onpointermove=e=>{if(!split.hasPointerCapture(e.pointerId))return;const r=work.getBoundingClientRect(),w=Math.max(280,Math.min(r.width*.58,r.right-e.clientX));document.documentElement.style.setProperty("--chat",Math.round(w)+"px")};split.onpointerup=e=>{if(split.hasPointerCapture(e.pointerId))split.releasePointerCapture(e.pointerId);document.body.style.cursor=""};document.onkeydown=e=>{if(e.key==="Escape")close()};render();
</script></body></html>
