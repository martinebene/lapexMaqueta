</style></head><body><header class="header"><button class="brand" id="brand"><img src="assets/lapex-logo.png" alt="Lapex.ai"></button><nav class="tools" id="tools"></nav><div class="title"><h1 id="title">Agente de Configuración</h1></div><button class="profile" id="profile"><img src="assets/profile-mebene.jpg" alt="Foto de perfil de mebene"><span>mebene</span></button></header><div class="work" id="work"><section class="main"><nav class="tabs" id="tabs" hidden></nav><div class="scroll" id="scroll"><div class="inner" id="content"></div></div></section><div class="split" id="split"></div><aside class="chat"><header class="chathead"><div class="chatname" id="chatname">Agente de Configuración</div><button class="foldbtn" id="fold">‹</button></header><div class="chatbody" id="chatbody"></div><div class="composer"><div class="settings"><div class="field"><span class="field-icon" aria-hidden="true">✦</span><select id="model" aria-label="Modelo de IA"><option>Lapex Core</option><option>Lapex Fast</option><option>Lapex Deep</option></select></div><div class="field"><span class="field-icon" aria-hidden="true">🧠</span><select id="reason" aria-label="Nivel de razonamiento"><option>Bajo</option><option selected>Medio</option><option>Alto</option></select></div></div><div class="compose"><textarea class="input" id="input" rows="3" placeholder="Escribí un mensaje..."></textarea><button class="send" id="send">Enviar</button></div></div></aside></div><script>
"use strict";const menus=[{label:"Análisis",items:[["nueva-sesion","Nueva sesión"],["abrir-sesion","Abrir sesión"],["compartir-sesion","Compartir sesión Lapex"],["recibir-sesion","Recibir sesión Lapex"]]},{label:"Configuración",items:[["agente-configuracion","Agente de Configuración"],["agentes-analisis","Agentes de análisis"],["circuitos","Circuitos"],["vehiculos","Vehículos"],["pilotos","Pilotos"],["skills-importacion","Skills de importación de datos"],["skills-representacion","Skills de representación de datos"],["skills-analisis","Skills de análisis de datos"],["skills-reportes","Skills de reportes"]]},{label:"Cuenta",items:[["mi-cuenta","Mi cuenta"],["estadisticas-uso","Estadísticas de uso"]]},{label:"Ayuda",items:[["asistente-ia","Asistente IA"],["faq","FAQ"],["contacto","Contacto"],["acerca","Acerca de"]]}],sections=Object.fromEntries(menus.flatMap(m=>m.items.map(([id,label])=>[id,{id,label,group:m.label}]))),noChat=new Set(["faq","contacto","acerca","mi-cuenta","estadisticas-uso","abrir-sesion","compartir-sesion","recibir-sesion"]),tabsBy={"agentes-analisis":["Resumen","Vehículos","Sesiones","Reportes","Skills disponibles"]},state={section:"agente-configuracion",tab:{"agentes-analisis":"Resumen"},fold:false,msg:{}};const $=id=>document.getElementById(id),tools=$("tools"),title=$("title"),tabs=$("tabs"),content=$("content"),scroll=$("scroll"),work=$("work"),split=$("split"),chatname=$("chatname"),chatbody=$("chatbody"),input=$("input"),model=$("model"),reason=$("reason");function esc(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}function menuRender(){tools.innerHTML=menus.map((m,i)=>`<div class="menu" data-i="${i}"><button class="trigger">${m.label}</button><div class="drop">${m.items.map(([id,l])=>`<button class="item" data-section="${id}">${l}</button>`).join("")}</div></div>`).join("")}function close(ex=null){document.querySelectorAll(".menu").forEach(m=>{if(m!==ex)m.classList.remove("open")})}function agent(id){if(id==="asistente-ia")return"Asistente IA";if(["nueva-sesion","skills-analisis","skills-reportes"].includes(id))return"Agente de análisis";return"Agente de Configuración"}function msgs(id){return state.msg[id]??=[{role:"ai",text:`${agent(id)}: conversación simulada de la maqueta.`},{role:"user",text:"Quiero trabajar sobre esta sección."},{role:"ai",text:"El contenido específico se definirá en próximas iteraciones."}]}function renderTabs(){const a=tabsBy[state.section];if(!a){tabs.hidden=true;tabs.innerHTML="";return}tabs.hidden=false;const act=state.tab[state.section]||a[0];tabs.innerHTML=a.map(t=>`<button class="tab ${t===act?"active":""}" data-tab="${t}">${t}</button>`).join("")}function renderContent(){const s=sections[state.section],t=state.tab[state.section];content.innerHTML=`<p class="context">${s.group}${t?` · ${t}`:""}</p><h2>${s.label}</h2><p class="lead">Esta superficie mantiene la estructura global de la maqueta. Su contenido funcional se definirá en una iteración específica.</p><div class="card"><strong>Superficie reservada</strong><p>Acá se incorporarán controles, datos, formularios o resultados propios de ${s.label}.</p></div><div class="blocks"><div class="block">Bloque de contenido 1</div><div class="block">Bloque de contenido 2</div><div class="block">Bloque de contenido 3</div></div>`}function renderChat(){const has=!noChat.has(state.section);work.classList.toggle("nochat",!has);work.classList.toggle("fold",has&&state.fold);if(!has)return;chatname.textContent=agent(state.section);chatbody.innerHTML=`<div class="note">Chat independiente, redimensionable y plegable. Modelo y razonamiento son opciones simuladas.</div>${msgs(state.section).map(m=>`<div class="msg ${m.role}">${esc(m.text)}</div>`).join("")}`;chatbody.scrollTop=chatbody.scrollHeight}function render(){const s=sections[state.section];title.textContent=s.label;document.querySelectorAll(".item").forEach(x=>x.classList.toggle("active",x.dataset.section===state.section));document.querySelectorAll(".menu").forEach(x=>x.classList.toggle("current",menus[+x.dataset.i].items.some(([id])=>id===state.section)));renderTabs();renderContent();renderChat();scroll.scrollTop=0}function setSection(id){if(!sections[id])return;state.section=id;close();render()}function send(){const t=input.value.trim();if(!t||noChat.has(state.section))return;msgs(state.section).push({role:"user",text:t},{role:"ai",text:`Respuesta simulada · ${model.value} · Razonamiento ${reason.value}.`});input.value="";renderChat();input.focus()}menuRender();tools.onclick=e=>{const tr=e.target.closest(".trigger");if(tr){const m=tr.closest(".menu"),o=!m.classList.contains("open");close(m);m.classList.toggle("open",o);return}const it=e.target.closest("[data-section]");if(it)setSection(it.dataset.section)};tabs.onclick=e=>{const t=e.target.closest("[data-tab]");if(t){state.tab[state.section]=t.dataset.tab;renderTabs();renderContent()}};document.onclick=e=>{if(!e.target.closest(".menu"))close()};$("brand").onclick=()=>setSection("agente-configuracion");$("profile").onclick=()=>setSection("mi-cuenta");$("fold").onclick=()=>{state.fold=!state.fold;renderChat()};$("send").onclick=send;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};split.onpointerdown=e=>{if(work.classList.contains("nochat")||work.classList.contains("fold"))return;e.preventDefault();split.setPointerCapture(e.pointerId);document.body.style.cursor="col-resize"};split.onpointermove=e=>{if(!split.hasPointerCapture(e.pointerId))return;const r=work.getBoundingClientRect(),w=Math.max(280,Math.min(r.width*.58,r.right-e.clientX));document.documentElement.style.setProperty("--cw",Math.round(w)+"px")};split.onpointerup=e=>{if(split.hasPointerCapture(e.pointerId))split.releasePointerCapture(e.pointerId);document.body.style.cursor=""};document.onkeydown=e=>{if(e.key==="Escape")close()};render();
