name: Ajustar lockfile Storybook (temporal)
on:
  push:
    branches: [prototipo/sidebar-07]
    paths:
      - package.json
      - .github/workflows/storybook-lock.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Resolver lockfile exacto en CI
        run: pnpm install --no-frozen-lockfile
      - name: Commit único del lockfile
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(storybook): fijar dependencias y lockfile"
          git push origin HEAD:prototipo/sidebar-07
