name: Maqueta React Nova
on:
  push:
    branches:
      - prototipo/react-shadcn
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Comprobar tipos y compilar
        run: pnpm run build
      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Pruebas de navegación real
        run: pnpm test:e2e
      - name: Publicar Nova en main/nova sin sustituir la maqueta HTML
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/lapex-maqueta-pages origin/main
          mkdir -p /tmp/lapex-maqueta-pages/nova
          rsync -a --delete dist/ /tmp/lapex-maqueta-pages/nova/
          git -C /tmp/lapex-maqueta-pages add nova
          if ! git -C /tmp/lapex-maqueta-pages diff --cached --quiet; then
            git -C /tmp/lapex-maqueta-pages config user.name "github-actions[bot]"
            git -C /tmp/lapex-maqueta-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C /tmp/lapex-maqueta-pages commit -m "build(maqueta): actualizar previsualización React en /nova"
            git -C /tmp/lapex-maqueta-pages push origin HEAD:main
          fi
      - name: Solicitar reconstrucción de GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Artefacto compilado para revisión
        uses: actions/upload-artifact@v4
        with:
          name: lapex-nova-preview
          path: dist/
          if-no-files-found: error
