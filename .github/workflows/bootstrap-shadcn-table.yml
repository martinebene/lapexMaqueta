name: Integración controlada Shadcn Table
on:
  push:
    branches:
      - prototipo/sidebar-07
    paths:
      - .github/workflows/bootstrap-shadcn-table.yml
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar dependencias en la fuente
        run: pnpm install --frozen-lockfile
      - name: Instalar registro Base UI en una copia temporal
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lapex-table"
          rsync -a --exclude='.git' --exclude=node_modules ./ "$RUNNER_TEMP/lapex-table/"
          cd "$RUNNER_TEMP/lapex-table"
          pnpm install --frozen-lockfile
          pnpm dlx shadcn@latest add https://www.shadcn-table.com/r/base/shadcn-table.json --overwrite --yes
          test -f src/components/ui/shadcn-table/index.ts
          echo "Registro instalado en carpeta temporal"
      - name: Integrar solo los nuevos componentes
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/lapex-table"
          cp -a "$BASE/src/components/ui/shadcn-table" src/components/ui/
          for f in "$BASE"/src/components/ui/*.tsx "$BASE"/src/components/ui/*.ts; do
            [ -f "$f" ] || continue
            target="src/components/ui/$(basename "$f")"
            if [ ! -e "$target" ]; then cp "$f" "$target"; fi
          done
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs'
          const before=JSON.parse(readFileSync('package.json','utf8'))
          const installed=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/lapex-table/package.json','utf8'))
          const additions={}
          for(const [k,v] of Object.entries(installed.dependencies??{})){
            if(!(k in before.dependencies)){before.dependencies[k]=v; additions[k]=v}
          }
          console.log('Nuevas dependencias:',additions)
          writeFileSync('package.json',JSON.stringify(before,null,2)+'\n')
          JS
          pnpm install --no-frozen-lockfile
          git status --short
      - name: Publicar archivos nuevos sin sobrescribir componentes previos
        run: |
          set -euo pipefail
          git add package.json pnpm-lock.yaml src/components/ui
          git diff --cached --stat
          if git diff --cached --quiet; then echo "No hay cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(maqueta): incorporar Shadcn Table Base UI sin sobrescribir UI compartida"
          git push origin HEAD:prototipo/sidebar-07
