name: Maqueta Lapex
on:
  push:
    branches:
      - prototipo/sidebar-07
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  publish-maqueta:
    name: Compilar y publicar Maqueta Lapex y Storybook
    needs: test-browser
    runs-on: ubuntu-latest
    concurrency:
      group: lapex-maqueta-preview
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Validar TypeScript y compilar versión publicable
        run: |
          echo "VITE_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          pnpm run build
      - name: Compilar Storybook React/Vite
        run: pnpm build:storybook
      - name: Comprobar salida de ambos sitios
        run: |
          test -s dist/index.html
          test -s storybook-static/index.html
          test -s storybook-static/index.json
      - name: Publicar /maqueta/ y /storybook/ en un único commit
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/lapex-maqueta-pages origin/main
          mkdir -p /tmp/lapex-maqueta-pages/maqueta
          rsync -a --delete dist/ /tmp/lapex-maqueta-pages/maqueta/
          mkdir -p /tmp/lapex-maqueta-pages/storybook
          rsync -a --delete storybook-static/ /tmp/lapex-maqueta-pages/storybook/
          rm -rf /tmp/lapex-maqueta-pages/sidebar-07
          printf '%s\n' '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=./maqueta/"><link rel="canonical" href="https://martinebene.github.io/lapexMaqueta/maqueta/"><title>Lapex · Maqueta</title><script>location.replace(new URL("./maqueta/", location.href))</script></head><body><p>Vista previa vigente: <a href="./maqueta/">Maqueta Lapex</a>.</p></body></html>' > /tmp/lapex-maqueta-pages/index.html
          git -C /tmp/lapex-maqueta-pages add -A index.html maqueta storybook
          if git -C /tmp/lapex-maqueta-pages ls-files -- sidebar-07 | grep -q .; then
            git -C /tmp/lapex-maqueta-pages add -A -- sidebar-07
          fi
          if ! git -C /tmp/lapex-maqueta-pages diff --cached --quiet; then
            git -C /tmp/lapex-maqueta-pages config user.name "github-actions[bot]"
            git -C /tmp/lapex-maqueta-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C /tmp/lapex-maqueta-pages commit -m "build(maqueta): publicar Maqueta Lapex y Storybook juntos"
            git -C /tmp/lapex-maqueta-pages push origin HEAD:main
          fi
      - name: Solicitar Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - uses: actions/upload-artifact@v4
        with:
          name: lapex-maqueta-dist
          path: |
            dist/
            storybook-static/
  test-browser:
    name: Playwright interfaz Maqueta Lapex
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Compilar Storybook para pruebas en navegador
        run: pnpm build:storybook
      - name: Preparar la ruta base de Pages
        run: |
          mkdir -p storybook-public/lapexMaqueta
          ln -s "$GITHUB_WORKSPACE/storybook-static" storybook-public/lapexMaqueta/storybook
      - name: Probar Storybook en Chromium
        run: pnpm test:storybook:smoke
