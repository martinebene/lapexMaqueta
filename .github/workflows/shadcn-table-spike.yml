name: Prueba aislada Shadcn Table
on:
  push:
    branches:
      - prototipo/sidebar-07
    paths:
      - .github/workflows/shadcn-table-spike.yml
permissions:
  contents: read
jobs:
  prueba-tabla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Preparar copia temporal aislada
        run: |
          mkdir -p "$RUNNER_TEMP/lapex-table-spike"
          rsync -a --exclude='.git' --exclude='node_modules' ./ "$RUNNER_TEMP/lapex-table-spike/"
          cd "$RUNNER_TEMP/lapex-table-spike"
          pnpm install --frozen-lockfile
      - name: Instalar registro oficial Base UI de Shadcn Table
        run: |
          cd "$RUNNER_TEMP/lapex-table-spike"
          pnpm dlx shadcn@latest add https://www.shadcn-table.com/r/base/shadcn-table.json --overwrite --yes
      - name: Crear banco de prueba temporal
        run: |
          cd "$RUNNER_TEMP/lapex-table-spike"
          cat > table-spike.html <<'HTML'
          <!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba aislada de tabla</title></head><body><div id="root"></div><script type="module" src="/src/table-spike.tsx"></script></body></html>
          HTML
          cat > src/table-spike.tsx <<'TSX'
          import {useMemo} from "react"
          import {createRoot} from "react-dom/client"
          import {ShadcnTable,useShadcnTable} from "./components/ui/shadcn-table"
          type Row = {id:string;name:string;category:string;year:number}
          function Spike(){
            const data = useMemo<Row[]>(()=>[
              {id:"p1",name:"Piloto Demo A",category:"Turismo",year:2026},
              {id:"p2",name:"Piloto Demo B",category:"Karting",year:2025},
              {id:"p3",name:"Piloto Demo C",category:"Turismo",year:2024}
            ],[])
            const columns = useMemo(()=>[
              {accessorKey:"name",header:"Nombre"},
              {accessorKey:"category",header:"Categoría",filterVariant:"select" as const},
              {accessorKey:"year",header:"Año"}
            ],[])
            const table=useShadcnTable({
              data,columns,
              enableRowSelection:true,
              enableMultiRowSelection:false,
              enableGlobalFilter:true,
              enableColumnFilters:true,
              enableGrouping:true,
              enableEditing:true,
              editDisplayMode:"row",
              renderDetailPanel:({row})=><div>Detalle técnico: {row.original.name}</div>
            })
            return <main>
              <h1>Prueba de compatibilidad de tablas</h1>
              <input aria-label="Buscar piloto" onChange={e=>table.setGlobalFilter(e.target.value)} />
              <select aria-label="Categoría exacta" defaultValue="" onChange={e=>table.getColumn("category")?.setFilterValue(e.target.value||undefined)}>
                <option value="">Todas</option><option value="Turismo">Turismo</option><option value="Karting">Karting</option>
              </select>
              <select aria-label="Agrupar registros" defaultValue="" onChange={e=>table.setGrouping(e.target.value?[e.target.value]:[])}>
                <option value="">Sin agrupar</option><option value="category">Categoría</option>
              </select>
              <output data-testid="count">{table.getFilteredRowModel().rows.length}</output>
              <output data-testid="selected">{Object.values(table.state.rowSelection??{}).filter(Boolean).length}</output>
              <output data-testid="grouped">{table.state.grouping?.length??0}</output>
              <ShadcnTable table={table}/>
            </main>
          }
          createRoot(document.getElementById("root")!).render(<Spike/>)
          TSX
      - name: Compilar original y código de prueba con TypeScript
        run: |
          cd "$RUNNER_TEMP/lapex-table-spike"
          pnpm run check
          pnpm run build
      - name: Playwright en Chromium, sin publicación
        run: |
          cd "$RUNNER_TEMP/lapex-table-spike"
          pnpm exec playwright install chromium
          pnpm exec vite --host 127.0.0.1 > /tmp/lapex-vite-spike.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS 'http://127.0.0.1:5173/table-spike.html' > /dev/null; then break; fi
            sleep 1
          done
          cat > spike-browser.mjs <<'JS'
          import {chromium} from '@playwright/test';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const failures=[];
          page.on('pageerror',e=>failures.push(e.message));
          await page.goto('http://127.0.0.1:5173/table-spike.html');
          await page.getByRole('heading',{name:'Prueba de compatibilidad de tablas'}).waitFor();
          const count=async()=>await page.getByTestId('count').innerText();
          if((await count())!=='3')throw Error('Cuenta inicial incorrecta: '+await count());
          await page.getByRole('textbox',{name:'Buscar piloto'}).fill('Demo A');
          if((await count())!=='1')throw Error('Filtro global incorrecto: '+await count());
          await page.getByRole('textbox',{name:'Buscar piloto'}).fill('');
          await page.getByRole('combobox',{name:'Categoría exacta'}).selectOption('Turismo');
          if((await count())!=='2')throw Error('Filtro por categoría incorrecto: '+await count());
          await page.getByRole('combobox',{name:'Categoría exacta'}).selectOption('');
          await page.getByRole('combobox',{name:'Agrupar registros'}).selectOption('category');
          if((await page.getByTestId('grouped').innerText())!=='1')throw Error('Agrupación fallida');
          await page.getByRole('combobox',{name:'Agrupar registros'}).selectOption('');
          const radio=page.getByRole('radio').first();
          await radio.waitFor();
          await radio.click();
          if((await page.getByTestId('selected').innerText())!=='1')throw Error('Selección única fallida');
          if(failures.length)throw Error('Errores en navegador: '+failures.join('; '));
          await page.screenshot({path:'table-spike.png',fullPage:true});
          await browser.close();
          console.log('Prueba real superada: carga, filtros global y exacto, agrupación, radio, sin errores JS.');
          JS
          node spike-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadcn-table-spike
          path: |
            ${{ runner.temp }}/lapex-table-spike/table-spike.png
